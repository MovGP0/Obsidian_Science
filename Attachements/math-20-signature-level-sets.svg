<text x="260" y="194" fill="#167a93" font-size="16" text-anchor="middle" font-weight="normal">Q = 1</text>
<text x="185" y="458" fill="#167a93" font-size="20" text-anchor="middle" font-weight="600">Signature (2, 0)</text>
