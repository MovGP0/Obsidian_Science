<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="500" viewBox="0 0 1100 500" role="img" aria-labelledby="title desc">
<title id="title">Signature and level sets</title><desc id="desc">Three quadratic forms on a two dimensional vector space. The circle has positive definite form, hyperbolas have indefinite form with two null lines, and parallel lines have a degenerate form with a vertical kernel.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8 Z" fill="#536273"/></marker>
<marker id="blueArrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8 Z" fill="#167a93"/></marker></defs>
<rect width="1100" height="500" fill="#ffffff"/>
<g font-family="Segoe UI, Arial, sans-serif">
<text x="550" y="35" fill="#243247" font-size="25" text-anchor="middle" font-weight="600">Quadratic forms on a two-dimensional vector space</text>
<rect x="25" y="64" width="320" height="365" rx="12" fill="#f7f9fc" stroke="#d4dce5"/>
<text x="185" y="95" fill="#243247" font-size="21" text-anchor="middle" font-weight="600">Positive definite</text>
<text x="185" y="124" fill="#243247" font-size="20" text-anchor="middle" font-weight="normal">Q = x² + y²</text>
<line x1="55" y1="275" x2="320" y2="275" stroke="#536273" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="185" y1="400" x2="185" y2="145" stroke="#536273" stroke-width="2" marker-end="url(#arrow)"/>
<text x="323" y="299" fill="#243247" font-size="17" text-anchor="middle" font-weight="normal">x</text>
<text x="170" y="153" fill="#243247" font-size="17" text-anchor="middle" font-weight="normal">y</text>
<text x="173" y="295" fill="#243247" font-size="14" text-anchor="middle" font-weight="normal">0</text>
<rect x="390" y="64" width="320" height="365" rx="12" fill="#f7f9fc" stroke="#d4dce5"/>
<text x="550" y="95" fill="#243247" font-size="21" text-anchor="middle" font-weight="600">Indefinite</text>
<text x="550" y="124" fill="#243247" font-size="20" text-anchor="middle" font-weight="normal">Q = x² − y²</text>
<line x1="420" y1="275" x2="685" y2="275" stroke="#536273" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="550" y1="400" x2="550" y2="145" stroke="#536273" stroke-width="2" marker-end="url(#arrow)"/>
<text x="688" y="299" fill="#243247" font-size="17" text-anchor="middle" font-weight="normal">x</text>
<text x="535" y="153" fill="#243247" font-size="17" text-anchor="middle" font-weight="normal">y</text>
<text x="538" y="295" fill="#243247" font-size="14" text-anchor="middle" font-weight="normal">0</text>
<rect x="755" y="64" width="320" height="365" rx="12" fill="#f7f9fc" stroke="#d4dce5"/>
<text x="915" y="95" fill="#243247" font-size="21" text-anchor="middle" font-weight="600">Degenerate</text>
<text x="915" y="124" fill="#243247" font-size="20" text-anchor="middle" font-weight="normal">Q = x²</text>
<line x1="785" y1="275" x2="1050" y2="275" stroke="#536273" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="915" y1="400" x2="915" y2="145" stroke="#536273" stroke-width="2" marker-end="url(#arrow)"/>
