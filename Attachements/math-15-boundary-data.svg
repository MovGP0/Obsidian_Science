<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="640" viewBox="0 0 1040 640">
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#334155"/></marker></defs>
<rect width="1040" height="640" fill="#ffffff"/>
<g font-family="DejaVu Sans, Arial, sans-serif" fill="#172033">
<text x="520" y="43" text-anchor="middle" font-size="25" font-weight="bold">Boundary and initial data on an evolution strip</text>
<text x="520" y="79" text-anchor="middle" font-size="19">0 &lt; x &lt; L,  0 &lt; t &lt; T</text>
<rect x="270" y="145" width="500" height="330" fill="#eff6ff" stroke="#cbd5e1" stroke-width="2"/>
<path d="M270 145 V475 H770 V145" fill="none" stroke="#1d4ed8" stroke-width="5"/>
<path d="M270 475 H770" stroke="#b45309" stroke-width="6"/>
<path d="M270 145 H770" stroke="#94a3b8" stroke-width="2" stroke-dasharray="8 7"/>
<path d="M240 495 H825" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M245 495 V115" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
<text x="842" y="502" font-size="21">x</text>
<text x="237" y="106" font-size="21">t</text>
<text x="270" y="526" text-anchor="middle" font-size="20">0</text>
<text x="770" y="526" text-anchor="middle" font-size="20">L</text>
<text x="520" y="245" text-anchor="middle" font-size="23">PDE holds in the interior</text>
<text x="520" y="285" text-anchor="middle" font-size="20">Initial profile: u(x, 0) = f(x)</text>
<text x="520" y="322" text-anchor="middle" font-size="20">Dirichlet: u(0, t) = a(t), u(L, t) = b(t)</text>
<path d="M270 380 H170" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>
<path d="M770 380 H870" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="140" y="345" text-anchor="middle" font-size="20">Outward normal</text>
<text x="140" y="425" text-anchor="middle" font-size="20">n = −1</text>
<text x="902" y="345" text-anchor="middle" font-size="20">Outward normal</text>
<text x="902" y="425" text-anchor="middle" font-size="20">n = +1</text>
<circle cx="270" cy="475" r="8" fill="#b45309"/>
<circle cx="770" cy="475" r="8" fill="#b45309"/>
<text x="520" y="572" text-anchor="middle" font-size="21" fill="#92400e">Corner compatibility: f(0) = a(0), f(L) = b(0)</text>
<text x="520" y="610" text-anchor="middle" font-size="18">The top edge only marks a chosen observation limit T.</text>
</g></svg>