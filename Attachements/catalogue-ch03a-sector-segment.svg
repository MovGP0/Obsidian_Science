<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="620" viewBox="0 0 1000 620" role="img" aria-label="Sector, segment, and annulus">
<rect width="1000" height="620" fill="white"/>
<style>text { font-family: Arial, sans-serif; font-size: 23px; fill: #172b3a; } .title {font-size:28px;font-weight:bold} .axis {stroke:#64748b;stroke-width:2} .curve {fill:none;stroke:#175b91;stroke-width:4} .guide {fill:none;stroke:#64748b;stroke-width:2;stroke-dasharray:7 5}</style>

<text x="55" y="55" class="title">A sector split at its chord</text><text x="625" y="55" class="title">An annulus</text>
<circle cx="240" cy="330" r="170" fill="none" stroke="#b6c2cc" stroke-width="2"/>
<path d="M240,330 L410,330 A170,170 0 0 0 325,182.776 Z" fill="#dcfce7" stroke="#175b91" stroke-width="3"/>
<path d="M410,330 A170,170 0 0 0 325,182.776 Z" fill="#bfdbfe" stroke="#175b91" stroke-width="3"/>
<text x="211" y="365">O</text><text x="285" y="362">radius r</text><text x="276" y="300">θ</text>
<text x="55" y="105">green = center triangle</text><text x="55" y="140">blue = circular segment</text>
<line x1="410" y1="245" x2="450" y2="215" stroke="#175b91" stroke-width="2"/><text x="422" y="202">arc</text>
<text x="65" y="550">sector area = triangle + segment</text>
<path d="M910,330 A160,160 0 1 0 590,330 A160,160 0 1 0 910,330 M840,330 A90,90 0 1 0 660,330 A90,90 0 1 0 840,330" fill="#ede9fe" fill-rule="evenodd" stroke="#6d42a1" stroke-width="3"/>
<line x1="750" y1="330" x2="910" y2="330" stroke="#6d42a1" stroke-width="3"/>
<line x1="750" y1="330" x2="750" y2="240" stroke="#175b91" stroke-width="3"/>
<text x="733" y="365">O</text><text x="805" y="365">R</text><text x="762" y="286">r</text>
<text x="625" y="550">area = π(R² − r²)</text>

</svg>