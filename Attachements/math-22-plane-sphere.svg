<text x="760" y="185" fill="#1d4ed8" font-size="23">Plane: f(u) = u</text>
<text x="385" y="397" fill="#92400e" font-size="23">Unit sphere: f(u) = sin u</text>
<circle cx="110" cy="430" r="5" fill="white" stroke="#b45309" stroke-width="3"/>
<circle cx="942.5220532012952" cy="430" r="5" fill="white" stroke="#b45309" stroke-width="3"/>
<rect x="40" y="510" width="495" height="150" rx="12" fill="#eff6ff" stroke="#bfdbfe"/>
<text x="62" y="545" fill="#1d4ed8" font-weight="600">Euclidean polar coordinates</text>
<text x="62" y="582">f′ = 1, f″ = 0  ⇒  K = 0</text>
<text x="62" y="618" font-size="19">Γᵘᵥᵥ = −u can be nonzero in a flat metric.</text>
<text x="62" y="644" font-size="18" fill="#475569">The chart uses u &gt; 0 and a local angle v.</text>

<rect x="555" y="510" width="505" height="150" rx="12" fill="#fffbeb" stroke="#fde68a"/>
<text x="578" y="545" fill="#92400e" font-weight="600">Sphere of radius 1</text>
<text x="578" y="582">f″ = −sin u  ⇒  K = 1</text>
<text x="578" y="618" font-size="19">The pole coordinates fail at u = 0 and u = π.</text>
<text x="578" y="644" font-size="18" fill="#475569">The metric and curvature remain smooth there.</text>
</g></svg>
