<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="530" viewBox="0 0 1100 530" role="img" aria-labelledby="title desc">
  <title id="title">The source's proposed cosmic gravitational background</title>
  <desc id="desc">Near Earth local gravity dominates, while a distant moving observer remains in the cosmic matter background. A blue-to-red schematic gradient indicates a velocity-dependent dipole, not measured sky data.</desc>
  <defs><linearGradient id="dipole"><stop stop-color="#bad9eb"/><stop offset="1" stop-color="#edd5b3"/></linearGradient><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#91594c"/></marker><g id="observer"><rect x="-90" y="-44" width="180" height="88" rx="20" fill="#f8fafb" stroke="#477798" stroke-width="3"/><circle cx="18" cy="-23" r="9" fill="none" stroke="#9a4f4c" stroke-width="3"/><path d="M15 -14 L6 12 L32 17 L43 36 M6 12 L27 8 L34 17 M1 8 L-7 27" fill="none" stroke="#9a4f4c" stroke-width="3"/></g></defs>
  <rect width="1100" height="530" fill="white"/>
  <rect x="25" y="52" width="505" height="370" rx="16" fill="#dae7d5"/><rect x="570" y="52" width="505" height="370" rx="16" fill="url(#dipole)"/>
  <g fill="#829784" opacity="0.45"><circle cx="76" cy="105" r="5"/><circle cx="167" cy="373" r="6"/><circle cx="464" cy="328" r="5"/><circle cx="481" cy="87" r="6"/><circle cx="410" cy="212" r="5"/><circle cx="92" cy="287" r="5"/><circle cx="611" cy="253" r="6"/><circle cx="755" cy="84" r="5"/><circle cx="1014" cy="149" r="5"/><circle cx="696" cy="377" r="5"/><circle cx="1001" cy="369" r="6"/><circle cx="796" cy="339" r="5"/></g>
  <circle cx="252" cy="274" r="101" fill="#90b4c3" stroke="#567b89" stroke-width="2"/><circle cx="636" cy="121" r="21" fill="#90b4c3" stroke="#567b89" stroke-width="2"/>
  <use href="#observer" x="281" y="111"/><use href="#observer" x="872" y="254" transform="rotate(17 872 254)"/>
  <path d="M866 177 L962 207" stroke="#91594c" stroke-width="3" marker-end="url(#arrow)"/>
  <g font-family="Arial, sans-serif" fill="#253544" font-size="21">
    <text x="35" y="32" font-weight="bold">(a) Near a massive local source</text><text x="581" y="32" font-weight="bold">(b) Far from isolated sources</text>
    <text x="231" y="279">Earth</text><text x="620" y="167">E</text><text x="967" y="207" font-style="italic">v</text>
    <text x="62" y="463">Local gravity + cosmic background</text><text x="594" y="463">Moving observer in the cosmic background</text>
    <text x="137" y="508" font-size="18">Explanatory schematic; the background colours are not an observed CMB map.</text>
  </g>
</svg>
