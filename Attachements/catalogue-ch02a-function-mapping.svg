<rect width="1000" height="580" fill="white"/>
<g font-family="Arial, sans-serif" font-size="25" fill="#172554" stroke-linejoin="round" stroke-linecap="round">

<text x="500" y="45" text-anchor="middle" font-size="31">A function needs one output for every input</text>
<ellipse cx="260" cy="290" rx="140" ry="205" fill="#eff6ff" stroke="#2563eb" stroke-width="3"/>
<ellipse cx="740" cy="290" rx="140" ry="205" fill="#f0fdf4" stroke="#15803d" stroke-width="3"/>
<text x="260" y="128" text-anchor="middle">Domain A</text><text x="740" y="128" text-anchor="middle">Codomain B</text>
<circle cx="260" cy="190" r="26" fill="white" stroke="#2563eb" stroke-width="2"/><text x="260" y="199" text-anchor="middle">−1</text>
<circle cx="260" cy="295" r="26" fill="white" stroke="#2563eb" stroke-width="2"/><text x="260" y="304" text-anchor="middle">0</text>
<circle cx="260" cy="400" r="26" fill="white" stroke="#2563eb" stroke-width="2"/><text x="260" y="409" text-anchor="middle">1</text>
<circle cx="740" cy="190" r="26" fill="white" stroke="#15803d" stroke-width="3"/><text x="740" y="199" text-anchor="middle">1</text>
