<path d="M290 295 L705 295" fill="none" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M290 400 L705 205" fill="none" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>
