<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600" role="img" aria-labelledby="title description">
<title id="title">Two periods generate a complex lattice</title><desc id="description">A slanted lattice is generated by a horizontal full period omega one and a slanted full period omega two. One fundamental parallelogram is shaded.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="context-stroke"/></marker></defs>
<rect width="1000" height="600" fill="white"/>
<g font-family="Arial, sans-serif" font-size="23" fill="#17212b">
<text x="50" y="48" font-size="29" font-weight="bold">Two periods generate a complex lattice</text>
<polygon points="210,420 365,420 423,302 268,302" fill="#dff0ec" stroke="#08766c" stroke-width="3"/>
<line x1="59.00" y1="538.00" x2="539.50" y2="538.00" stroke="#d2d9df" stroke-width="1" />
<line x1="117.00" y1="420.00" x2="597.50" y2="420.00" stroke="#d2d9df" stroke-width="1" />
<line x1="175.00" y1="302.00" x2="655.50" y2="302.00" stroke="#d2d9df" stroke-width="1" />
<line x1="233.00" y1="184.00" x2="713.50" y2="184.00" stroke="#d2d9df" stroke-width="1" />
<line x1="169.40" y1="502.60" x2="357.90" y2="119.10" stroke="#d2d9df" stroke-width="1" />
<line x1="324.40" y1="502.60" x2="512.90" y2="119.10" stroke="#d2d9df" stroke-width="1" />
<line x1="479.40" y1="502.60" x2="667.90" y2="119.10" stroke="#d2d9df" stroke-width="1" />
<circle cx="152" cy="538" r="6" fill="#174e88"/>
<circle cx="210" cy="420" r="6" fill="#174e88"/>
<circle cx="268" cy="302" r="6" fill="#174e88"/>
<circle cx="326" cy="184" r="6" fill="#174e88"/>
<circle cx="307" cy="538" r="6" fill="#174e88"/>
<circle cx="365" cy="420" r="6" fill="#174e88"/>
<circle cx="423" cy="302" r="6" fill="#174e88"/>
<circle cx="481" cy="184" r="6" fill="#174e88"/>
<circle cx="462" cy="538" r="6" fill="#174e88"/>
<circle cx="520" cy="420" r="6" fill="#174e88"/>
<circle cx="578" cy="302" r="6" fill="#174e88"/>
<circle cx="636" cy="184" r="6" fill="#174e88"/>
<line x1="210.00" y1="420.00" x2="365.00" y2="420.00" stroke="#174e88" stroke-width="4" marker-end="url(#arrow)"/>
<line x1="210.00" y1="420.00" x2="268.00" y2="302.00" stroke="#ae3c31" stroke-width="4" marker-end="url(#arrow)"/>
<text x="275" y="457" fill="#174e88">ω₁</text>
<text x="203" y="354" fill="#ae3c31">ω₂</text>
<text x="180" y="453" >0</text>
<text x="650" y="190" >Lattice points:</text>
<text x="650" y="233" >mω₁ + nω₂</text>
<text x="650" y="278" >m, n are integers.</text>
<text x="650" y="360" >The shaded cell repeats</text>
<text x="650" y="400" >in both directions.</text>
<text x="650" y="480" >ω₂ / ω₁ is not real.</text>
</g></svg>
