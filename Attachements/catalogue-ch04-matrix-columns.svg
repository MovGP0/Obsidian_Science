<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="460" viewBox="0 0 1000 460" role="img" aria-label="Columns of a shear map">
<rect width="1000" height="460" fill="white"/>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6 Z" fill="context-stroke"/></marker></defs>
<g font-family="Arial, sans-serif" font-size="24" fill="#172033">
<text x="75" y="48" font-size="28">Unit square</text><text x="600" y="48" font-size="28">After S(x, y) = (x + y, y)</text>
<path d="M80 340 H300 M100 360 V170 M570 340 H950 M600 365 V165" stroke="#9ca3af" stroke-width="2" fill="none"/>
<polygon points="100,340 260,340 260,180 100,180" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/>
<path d="M100 340 H260 M100 340 V180" stroke="#1d4ed8" stroke-width="4" marker-end="url(#arrow)"/>
<text x="145" y="385">e₁ = (1, 0)</text><text x="55" y="155">e₂ = (0, 1)</text>
<path d="M365 255 H515" stroke="#374151" stroke-width="3" marker-end="url(#arrow)"/><text x="420" y="230">S</text>
<polygon points="600,340 760,340 920,180 760,180" fill="#dcfce7" stroke="#15803d" stroke-width="3"/>
<path d="M600 340 H760 M600 340 L760 180" stroke="#166534" stroke-width="4" marker-end="url(#arrow)"/>
<text x="610" y="385">S e₁ = (1, 0)</text><text x="580" y="145">S e₂ = (1, 1)</text>
<text x="300" y="435">Each column is an image of one basis vector.</text></g></svg>