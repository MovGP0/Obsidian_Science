<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 670" width="1100" height="670" role="img" aria-labelledby="kk-phase-title">
  <title id="kk-phase-title">The phase and connection compensate on every link</title>
  <desc>Editable vector explanation. All labels are SVG text; no raster images are embedded.</desc>
  <defs>
    <marker id="kk-phase-ink" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,4 L0,8 Z" fill="#263445" />
    </marker>
    <marker id="kk-phase-teal" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,4 L0,8 Z" fill="#006d77" />
    </marker>
    <marker id="kk-phase-red" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,4 L0,8 Z" fill="#b22222" />
    </marker>
    <marker id="kk-phase-purple" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,4 L0,8 Z" fill="#6a3d9a" />
    </marker>
  </defs>
  <rect x="0" y="0" width="1100" height="670" fill="#ffffff" rx="14" />
  <text x="550.0" y="49" fill="#263445" font-size="31" font-family="Segoe UI, Arial, sans-serif" font-weight="600" text-anchor="middle">
    <tspan x="550.0" dy="0">
      <tspan>The phase and connection compensate on every link</tspan>
    </tspan>
  </text>
  <circle cx="220" cy="215" r="55" fill="#f1f9f8" stroke="#006d77" stroke-width="3" />
  <line x1="220" y1="215" x2="264" y2="215" stroke="#006d77" stroke-width="4" fill="none" marker-end="url(#kk-phase-teal)" />
  <circle cx="550" cy="215" r="55" fill="#f1f9f8" stroke="#006d77" stroke-width="3" />
  <line x1="550" y1="215" x2="594" y2="215" stroke="#006d77" stroke-width="4" fill="none" marker-end="url(#kk-phase-teal)" />
  <circle cx="880" cy="215" r="55" fill="#f1f9f8" stroke="#006d77" stroke-width="3" />
  <line x1="880" y1="215" x2="924" y2="215" stroke="#006d77" stroke-width="4" fill="none" marker-end="url(#kk-phase-teal)" />
  <text x="550" y="105" fill="#263445" font-size="29" font-family="Segoe UI, Arial, sans-serif" font-weight="400" text-anchor="middle">
    <tspan x="550" dy="0">
      <tspan>Representation 1: χ = 0 and A = 0</tspan>
    </tspan>
  </text>
  <line x1="290" y1="215" x2="480" y2="215" stroke="#b22222" stroke-width="2" fill="none" />
  <text x="385.0" y="180" fill="#b22222" font-size="20" font-family="Segoe UI, Arial, sans-serif" font-weight="400" text-anchor="middle">
    <tspan x="385.0" dy="0">
      <tspan>connection phase = 0</tspan>
    </tspan>
  </text>
  <line x1="620" y1="215" x2="810" y2="215" stroke="#b22222" stroke-width="2" fill="none" />
  <text x="715.0" y="180" fill="#b22222" font-size="20" font-family="Segoe UI, Arial, sans-serif" font-weight="400" text-anchor="middle">
    <tspan x="715.0" dy="0">
      <tspan>connection phase = 0</tspan>
    </tspan>
  </text>
  <text x="550" y="340" fill="#263445" font-size="28" font-family="Segoe UI, Arial, sans-serif" font-weight="400" text-anchor="middle">
    <tspan x="550" dy="0">
      <tspan>Representation 2: choose qε = (0, π/3, −π/4)</tspan>
    </tspan>
  </text>
  <circle cx="220" cy="455" r="55" fill="#f1f9f8" stroke="#006d77" stroke-width="3" />
  <line x1="220" y1="455" x2="264.0" y2="455.0" stroke="#006d77" stroke-width="4" fill="none" marker-end="url(#kk-phase-teal)" />
  <circle cx="550" cy="455" r="55" fill="#f1f9f8" stroke="#006d77" stroke-width="3" />
  <line x1="550" y1="455" x2="572.0" y2="493.1051177665153" stroke="#006d77" stroke-width="4" fill="none" marker-end="url(#kk-phase-teal)" />
  <circle cx="880" cy="455" r="55" fill="#f1f9f8" stroke="#006d77" stroke-width="3" />
  <line x1="880" y1="455" x2="911.1126983722081" y2="423.8873016277919" stroke="#006d77" stroke-width="4" fill="none" marker-end="url(#kk-phase-teal)" />
  <line x1="290" y1="455" x2="480" y2="455" stroke="#b22222" stroke-width="2" fill="none" />
  <text x="385.0" y="415" fill="#b22222" font-size="22" font-family="Segoe UI, Arial, sans-serif" font-weight="400" text-anchor="middle">
    <tspan x="385.0" dy="0">
      <tspan>q∫A′·dx = +π/3</tspan>
    </tspan>
  </text>
  <line x1="620" y1="455" x2="810" y2="455" stroke="#b22222" stroke-width="2" fill="none" />
  <text x="715.0" y="415" fill="#b22222" font-size="22" font-family="Segoe UI, Arial, sans-serif" font-weight="400" text-anchor="middle">
    <tspan x="715.0" dy="0">
      <tspan>q∫A′·dx = −7π/12</tspan>
    </tspan>
  </text>
  <text x="220" y="545" fill="#006d77" font-size="24" font-family="Segoe UI, Arial, sans-serif" font-weight="400" text-anchor="middle">
    <tspan x="220" dy="0">
      <tspan>χ′ = 0</tspan>
    </tspan>
  </text>
  <text x="550" y="545" fill="#006d77" font-size="24" font-family="Segoe UI, Arial, sans-serif" font-weight="400" text-anchor="middle">
    <tspan x="550" dy="0">
      <tspan>χ′ = −π/3</tspan>
    </tspan>
  </text>
  <text x="880" y="545" fill="#006d77" font-size="24" font-family="Segoe UI, Arial, sans-serif" font-weight="400" text-anchor="middle">
    <tspan x="880" dy="0">
      <tspan>χ′ = +π/4</tspan>
    </tspan>
  </text>
  <text x="550" y="625" fill="#263445" font-size="25" font-family="Segoe UI, Arial, sans-serif" font-weight="400" text-anchor="middle">
    <tspan x="550" dy="0">
      <tspan>On both links: Δχ′ + q∫A′·dx = 0, just as before the gauge change.</tspan>
    </tspan>
  </text>
</svg>
