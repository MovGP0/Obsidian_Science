<svg xmlns="http://www.w3.org/2000/svg" width="1050" height="540" viewBox="0 0 1050 540" role="img" aria-labelledby="title desc">
<title id="title">Two neighboring piecewise linear hat functions</title>
<desc id="desc">One hat peaks at the first interior node and the next at the second. They overlap only on the interval between those nodes.</desc>
<rect width="1050" height="540" fill="white"/>
<g font-family="Arial, sans-serif" fill="#17202a">
<text x="60" y="55" font-size="30" font-weight="bold">Local basis functions make a sparse linear system</text>
<rect x="310" y="120" width="190" height="235" fill="#f1f3f5"/>
<path d="M 120 355 L 910 355 M 120 355 L 120 105" stroke="#59636e" stroke-width="2" fill="none"/>
<path d="M 120 355 L 310 145 L 500 355 L 880 355" fill="none" stroke="#205cb2" stroke-width="5"/>
<path d="M 120 355 L 310 355 L 500 145 L 690 355 L 880 355" fill="none" stroke="#bd5b00" stroke-width="4" stroke-dasharray="10 6"/>
<path d="M 120 145 L 310 145 M 500 145 L 880 145" stroke="#c5cbd2" stroke-width="1.5" stroke-dasharray="5 6"/>
<text x="88" y="154" font-size="24">1</text><text x="88" y="364" font-size="24">0</text>
<path d="M 310 355 L 310 365 M 500 355 L 500 365 M 690 355 L 690 365 M 880 355 L 880 365" stroke="#59636e" stroke-width="2"/>
<text x="110" y="397" font-size="24">x₀</text><text x="299" y="397" font-size="24">x₁</text><text x="489" y="397" font-size="24">x₂</text><text x="679" y="397" font-size="24">x₃</text><text x="869" y="397" font-size="24">x₄</text>
<text x="260" y="122" font-size="25" fill="#205cb2">φ₁</text><text x="515" y="122" font-size="25" fill="#9b4b00">φ₂</text>
<path d="M 310 420 L 500 420 M 310 412 L 310 428 M 500 412 L 500 428" stroke="#59636e" stroke-width="2"/>
<text x="319" y="459" font-size="23">Overlap interval</text>
<text x="720" y="195" font-size="24">φ₁(x₁) = 1</text><text x="720" y="235" font-size="23">φ₁ = 0 at other nodes</text>
<text x="720" y="285" font-size="23">Only neighbors interact.</text>
<text x="60" y="514" font-size="21" fill="#59636e">A coefficient sets a node value. Straight segments connect adjacent node values.</text>
</g></svg>