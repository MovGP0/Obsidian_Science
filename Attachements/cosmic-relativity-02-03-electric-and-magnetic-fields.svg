<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="560" viewBox="0 0 1040 560" role="img" aria-labelledby="title desc">
  <title id="title">Radial electric field and closed magnetic field lines</title>
  <desc id="desc">The electric field of a positive charge Q points radially outward. A test charge q at distance r samples the field. The magnetic field around a current loop has closed field lines. The figures are schematic.</desc>
  <defs>
    <marker id="electric-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b22222"/>
    </marker>
    <marker id="magnetic-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1f4e8c"/>
    </marker>
  </defs>
  <rect width="1040" height="560" rx="16" fill="#fff"/>
  <g font-family="Arial, sans-serif" fill="#172033">
    <text x="260" y="45" text-anchor="middle" font-size="25" font-weight="bold">Electric field E</text>
    <text x="780" y="45" text-anchor="middle" font-size="25" font-weight="bold">Magnetic field B</text>
    <g stroke="#b22222" stroke-width="2.5" marker-end="url(#electric-arrow)">
      <line x1="260" y1="285" x2="260" y2="85"/>
      <line x1="260" y1="285" x2="360" y2="112"/>
      <line x1="260" y1="285" x2="433" y2="185"/>
      <line x1="260" y1="285" x2="460" y2="285"/>
      <line x1="260" y1="285" x2="433" y2="385"/>
      <line x1="260" y1="285" x2="360" y2="458"/>
      <line x1="260" y1="285" x2="260" y2="485"/>
      <line x1="260" y1="285" x2="160" y2="458"/>
      <line x1="260" y1="285" x2="87" y2="385"/>
      <line x1="260" y1="285" x2="60" y2="285"/>
      <line x1="260" y1="285" x2="87" y2="185"/>
      <line x1="260" y1="285" x2="160" y2="112"/>
    </g>
    <circle cx="260" cy="285" r="23" fill="#fff0ed" stroke="#b22222" stroke-width="2"/>
    <text x="260" y="292" text-anchor="middle" font-size="20">+Q</text>
    <circle cx="411" cy="198" r="6" fill="#34465e"/>
    <text x="423" y="203" font-size="22">q</text>
    <text x="332" y="227" font-size="22">r</text>
    <g fill="none" stroke="#1f4e8c" stroke-width="2.5" marker-mid="url(#magnetic-arrow)">
      <path d="M 780 285 C 780 15 1000 15 1000 285 C 1000 555 780 555 780 285"/>
      <path d="M 780 285 C 780 75 935 75 935 285 C 935 495 780 495 780 285"/>
      <path d="M 780 285 C 780 130 875 130 875 285 C 875 440 780 440 780 285"/>
      <path d="M 780 285 C 780 555 560 555 560 285 C 560 15 780 15 780 285"/>
      <path d="M 780 285 C 780 495 625 495 625 285 C 625 75 780 75 780 285"/>
      <path d="M 780 285 C 780 440 685 440 685 285 C 685 130 780 130 780 285"/>
    </g>
    <ellipse cx="780" cy="285" rx="28" ry="11" fill="#fff" stroke="#34465e" stroke-width="4"/>
    <text x="780" y="325" text-anchor="middle" font-size="18">Current loop</text>
    <text x="260" y="540" text-anchor="middle" font-size="19">Open radial field lines</text>
    <text x="780" y="540" text-anchor="middle" font-size="19">Closed field lines</text>
  </g>
</svg>
