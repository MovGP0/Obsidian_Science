<path d="M90 335 L630 335 M350 590 L350 75" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M350 335 L482 159" stroke="#334155" stroke-width="4"/>
<path d="M350 335 L482 335 L482 159" stroke="#2563eb" stroke-width="4" fill="none"/>
<path d="M466 335 L466 319 L482 319" fill="none" stroke="#64748b" stroke-width="2"/>
<path d="M411 335 A61 61 0 0 0 386.6 286.2" fill="none" stroke="#b45309" stroke-width="3"/>
<circle cx="482" cy="159" r="7" fill="#1d4ed8"/>
<text x="505" y="142">(cos θ, sin θ)</text>
<text x="407" y="371" text-anchor="middle" fill="#1d4ed8">cos θ</text>
<text x="510" y="265" fill="#1d4ed8">sin θ</text>
<text x="419" y="303" fill="#92400e">θ</text><text x="388" y="227">1</text>
<text x="580" y="369">1</text><text x="318" y="112">1</text><text x="310" y="368">0</text>
<text x="650" y="343">horizontal</text><text x="360" y="77">vertical</text>
<text x="500" y="624" text-anchor="middle">cos² θ + sin² θ = 1 comes from the circle equation.</text>

