<text x="590" y="150" font-size="23" fill="#172b42" >Dual coframe</text>
<text x="590" y="190" font-size="22" fill="#172b42" >θ¹ = dr       θ² = r dφ</text>
<text x="590" y="235" font-size="21" fill="#172b42" >θ¹(eᵣ) = 1</text>
<text x="590" y="271" font-size="21" fill="#172b42" >θ²(eφ) = 1</text>
<text x="590" y="307" font-size="21" fill="#172b42" >θ²(∂φ) = r = 2</text>
<text x="590" y="363" font-size="23" fill="#172b42" >Component conversion</text>
<text x="590" y="405" font-size="22" fill="#172b42" >V = 3∂ᵣ + 2∂φ</text>
<text x="590" y="445" font-size="22" fill="#172b42" >V = 3eᵣ + 4eφ  at r = 2</text>
<text x="590" y="488" font-size="17" fill="#172b42" >Same vector; different components.</text>
<text x="40" y="564" font-size="21" fill="#172b42" >The coordinate angular vector grows with r.</text>
<text x="40" y="598" font-size="20" fill="#4f6379" >The unit angular vector and the form r dφ have reciprocal scale factors.</text>
