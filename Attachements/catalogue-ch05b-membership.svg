<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="590" viewBox="0 0 1000 590" role="img" aria-labelledby="title desc">
<title id="title">Triangular fuzzy membership for close to five</title><desc id="desc">The function increases linearly from zero at x equals zero to one at x equals five, then decreases to zero at x equals ten. At x equals two its membership is zero point four.</desc>
<rect width="1000" height="590" fill="white"/>
<g font-family="Arial, sans-serif" fill="#17212d"><text x="500" y="45" text-anchor="middle" font-size="30" font-weight="bold">Membership in “close to five”</text>
<path d="M130 450L510 130L890 450Z" fill="#e7f0fa"/>
<g stroke="#a3acb8" stroke-width="2" stroke-dasharray="7 7" fill="none"><path d="M130 130H900"/><path d="M130 322H282V450"/><path d="M510 130V450"/></g>
<g stroke="#17212d" stroke-width="3"><path d="M130 90V450H930" fill="none"/><path d="M282 450V460M510 450V460M890 450V460"/></g>
<path d="M130 450L510 130L890 450" fill="none" stroke="#24538b" stroke-width="6"/>
<circle cx="282" cy="322" r="8" fill="#b43d1d"/>
<g font-size="24"><text x="106" y="458" text-anchor="end">0</text><text x="282" y="493" text-anchor="middle">2</text><text x="510" y="493" text-anchor="middle">5</text><text x="890" y="493" text-anchor="middle">10</text><text x="106" y="330" text-anchor="end">0.4</text><text x="106" y="138" text-anchor="end">1</text><text x="942" y="459">x</text><text x="69" y="90">μ</text></g>
<text x="327" y="321" font-size="25" fill="#943016">μ(2) = 0.4</text>
<text x="500" y="553" text-anchor="middle" font-size="25">μ(x) = max(0, 1 − |x − 5| / 5)</text>
</g></svg>
