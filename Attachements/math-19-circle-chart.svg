<circle cx="392.5" cy="300" r="7" fill="#b45309"/>
<text x="317" y="105">N = (0, 1)</text>
<text x="460" y="418">P = (0.8, −0.6)</text>
<text x="405" y="285" fill="#92400e">u = 0.5</text>
<text x="277" y="327">0</text>
<text x="492" y="328">1</text>
<text x="89" y="328">−1</text>
<text x="675" y="308">coordinate line</text>
<rect x="610" y="110" width="290" height="135" rx="12" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="630" y="146">u = x / (1 − y)</text>
<text x="630" y="183">0.8 / (1 + 0.6) = 0.5</text>
<text x="630" y="221">N has no finite u value.</text>
<text x="70" y="540" font-size="19">The chart covers S¹ minus N. A second chart supplies coordinates at N.</text>
