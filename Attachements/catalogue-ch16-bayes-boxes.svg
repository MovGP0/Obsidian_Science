<text x="45" y="286">Box II: 8 units</text><text x="45" y="320" class="small">Prior probability 2/3</text>
<text x="700" y="151">Given blue:</text><text x="700" y="190">5 units remain</text>
<text x="700" y="370">3 from box I</text><text x="700" y="408">P(I | blue) = 3/5</text>
