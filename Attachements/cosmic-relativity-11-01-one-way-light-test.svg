<svg xmlns="http://www.w3.org/2000/svg" width="900" height="650" viewBox="0 0 900 650" role="img" aria-labelledby="title desc">
  <title id="title">Clock-referenced one-way optical propagation test</title>
  <desc id="desc">A slowly rotating frame with global velocity u carries two stable clocks joined by an optical fibre of length L. Modulated light travels from one clock to the other and its received phase is compared with the second clock.</desc>
  <defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#263238"/></marker><g id="clock"><rect x="-45" y="-31" width="90" height="62" rx="8" fill="#e3f2fd" stroke="#263238" stroke-width="2"/><text x="0" y="-5" text-anchor="middle">Stable</text><text x="0" y="20" text-anchor="middle">clock</text></g><g id="pulses"><path d="M-55 18 H-45 V-10 H-25 V18 H-5 V-10 H15 V18 H35 V-10 H55 V18 H65" fill="none" stroke="#37474f" stroke-width="3"/></g></defs>
  <rect width="900" height="650" fill="white"/>
  <circle cx="411" cy="312" r="270" fill="#fafafa" stroke="#263238" stroke-width="3"/>
  <g font-family="Arial, sans-serif" font-size="22" fill="#18242b">
    <path d="M514 84 Q460 55 405 65" fill="none" stroke="#263238" stroke-width="3" marker-end="url(#arrow)"/><text x="466" y="112" text-anchor="middle">v = ωr</text>
    <path d="M247 363 L574 214" fill="none" stroke="#263238" stroke-width="6"/>
    <path d="M350 288 L454 241" fill="none" stroke="#1565c0" stroke-width="3" marker-end="url(#arrow)"/><text x="386" y="248" transform="rotate(-24 386 248)" fill="#1565c0">Light</text><text x="434" y="316" font-size="28">L</text>
    <g transform="translate(230 326)"><use href="#clock"/></g><g transform="translate(583 174)"><use href="#clock"/></g>
    <g transform="translate(237 409)"><use href="#pulses"/></g><g transform="translate(585 256)"><use href="#pulses"/></g>
    <path d="M552 369 H790" fill="none" stroke="#263238" stroke-width="4" marker-end="url(#arrow)"/><text x="748" y="352" font-size="29">u</text>
    <text x="411" y="613" text-anchor="middle">Optical fibre and clock references rotate together.</text>
  </g>
</svg>
