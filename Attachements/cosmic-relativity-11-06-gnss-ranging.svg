<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="650" viewBox="0 0 1000 650" role="img" aria-labelledby="title desc">
  <title id="title">GNSS signal timing to ground and mobile receivers</title>
  <desc id="desc">Two satellites emit signals towards a ground receiver on rotating Earth and a moving receiver above it. The schematic labels emission and reception times, satellite velocities, receiver velocity, and the ranging displacement.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#263238"/></marker>
    <marker id="red" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#c62828"/></marker>
    <marker id="blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#245b9e"/></marker>
    <g id="sat"><rect x="-17" y="-17" width="34" height="34" rx="4" fill="#00849a"/><rect x="-72" y="-13" width="46" height="26" fill="#e0f7fa" stroke="#00849a" stroke-width="2"/><rect x="26" y="-13" width="46" height="26" fill="#e0f7fa" stroke="#00849a" stroke-width="2"/><path d="M-26 0 H-17 M17 0 H26" stroke="#00849a" stroke-width="3"/></g>
    <g id="receiver"><rect x="-20" y="-16" width="40" height="32" rx="4" fill="#90caf9" stroke="#245b9e" stroke-width="3"/><path d="M-12 -9 H12 V6 H-12 Z" fill="#e3f2fd" stroke="#245b9e"/></g>
  </defs>
  <rect width="1000" height="650" fill="white"/>
  <circle cx="510" cy="494" r="126" fill="#d4eaf3" stroke="#598a9c" stroke-width="2"/>
  <g fill="none" stroke="#91b5b8" stroke-width="1.5"><ellipse cx="510" cy="494" rx="126" ry="38"/><ellipse cx="510" cy="494" rx="126" ry="85"/><ellipse cx="510" cy="494" rx="45" ry="126"/><ellipse cx="510" cy="494" rx="90" ry="126"/></g>
  <g fill="none" stroke-width="2"><path d="M210 112 L500 474 M820 132 L520 474" stroke="#263238" marker-end="url(#arrow)"/><path d="M210 112 L519 323 M820 132 L555 323" stroke="#245b9e" marker-end="url(#blue)"/></g>
  <g transform="translate(200 99) rotate(-37)"><use href="#sat"/></g><g transform="translate(830 119) rotate(39)"><use href="#sat"/></g>
  <use href="#receiver" x="510" y="493"/><use href="#receiver" x="538" y="338"/>
  <g font-family="Arial, sans-serif" font-size="23" fill="#18242b">
    <text x="115" y="57">GNSS</text><text x="850" y="78">GNSS</text><text x="218" y="145">tₑ₁</text><text x="767" y="162">tₑ₂</text>
    <path d="M204 148 L175 190 M797 158 L752 129" fill="none" stroke="#263238" stroke-width="2" marker-end="url(#arrow)"/><text x="145" y="218">vₛ</text><text x="716" y="125">vₛ</text>
    <text x="360" y="207" fill="#245b9e">dₛᵣ</text><text x="405" y="306">tᵣ₁</text><text x="570" y="366">tᵣ₂</text><text x="583" y="313">Mobile receiver</text>
    <path d="M558 335 L617 307" fill="none" stroke="#c62828" stroke-width="3" marker-end="url(#red)"/><text x="619" y="300">vₒ</text>
    <path d="M464 548 Q511 563 558 548" fill="none" stroke="#c62828" stroke-width="3" marker-end="url(#red)"/><text x="510" y="591" text-anchor="middle">Earth rotates</text><text x="510" y="458" text-anchor="middle">Ground receiver</text>
  </g>
</svg>
