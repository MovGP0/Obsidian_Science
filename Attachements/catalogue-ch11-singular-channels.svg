<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="610" viewBox="0 0 1000 610" role="img">
<rect width="1000" height="610" fill="white"/>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#1e293b"/></marker></defs>
<g font-family="Segoe UI, Arial, sans-serif" font-size="24" fill="#172033">
<title>Two independent singular channels and their error amplification</title>
<text x="500" y="55" text-anchor="middle" font-size="29" font-weight="bold">Two orthonormal modes under one operator</text>
<text x="190" y="120" text-anchor="middle" font-weight="bold">Input coefficients</text>
<text x="810" y="120" text-anchor="middle" font-weight="bold">Output coefficients</text>
<rect x="60" y="160" width="250" height="90" rx="12" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
<rect x="690" y="160" width="250" height="90" rx="12" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
<text x="185" y="215" text-anchor="middle">2 in mode e₀</text>
<text x="815" y="215" text-anchor="middle">2 in mode e₀</text>
<path d="M330 205H670" stroke="#1e293b" stroke-width="3" marker-end="url(#arrow)"/>
<text x="500" y="185" text-anchor="middle">multiply by 1</text>
<rect x="60" y="300" width="250" height="90" rx="12" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
<rect x="690" y="300" width="250" height="90" rx="12" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
<text x="185" y="355" text-anchor="middle">4 in mode e₁</text>
<text x="815" y="355" text-anchor="middle">1 in mode e₁</text>
<path d="M330 345H670" stroke="#1e293b" stroke-width="3" marker-end="url(#arrow)"/>
<text x="500" y="325" text-anchor="middle">multiply by 1/4</text>
<path d="M670 445H330" stroke="#1e293b" stroke-width="3" marker-end="url(#arrow)"/>
<text x="500" y="483" text-anchor="middle">Recovery in the second mode multiplies by 4.</text>
<text x="500" y="530" text-anchor="middle">An output error δ e₁ becomes an input error 4δ e₁.</text>
<text x="500" y="575" text-anchor="middle" fill="#475569">Inputs perpendicular to both modes have zero output.</text>
</g></svg>