<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="530" viewBox="0 0 1100 530" role="img" aria-labelledby="title desc">
<title id="title">Flat connection with nontrivial circle holonomy</title><desc id="desc">Five local fibre diagrams show parallel coefficients exp of minus i theta over two for theta from zero to two pi. Initial and final base points coincide, but the vector changes sign.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/></marker><marker id="blue-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2563a8"/></marker></defs>
<rect width="100%" height="100%" fill="#ffffff"/>
<g font-family="Arial, sans-serif" font-size="21" fill="#172b44">
<text x="50" y="46" font-size="27" font-weight="bold">Flat transport around a circle</text>
<text x="50" y="90">A = ½ dθ;      F = dA = 0;      v(θ) = exp(−iθ/2), with v(0) = 1</text>
<line x1="100" y1="157" x2="1000" y2="157" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>
<text x="550" y="130" text-anchor="middle" font-size="18">Lifted base angle along one counterclockwise turn</text>
<circle cx="100" cy="157" r="5" fill="#334155"/>
<text x="100" y="195" text-anchor="middle">0</text>
<circle cx="100" cy="290" r="57" fill="#eef5fb" stroke="#b5c4d6" stroke-width="2"/>
<line x1="36" y1="290" x2="164" y2="290" stroke="#a4b4c6" stroke-width="1"/>
<line x1="100" y1="226" x2="100" y2="354" stroke="#a4b4c6" stroke-width="1"/>
<line x1="100" y1="290" x2="145.000" y2="290.000" stroke="#2563a8" stroke-width="4" marker-end="url(#blue-arrow)"/>
<text x="100" y="393" text-anchor="middle" font-size="19">1</text>
<circle cx="325" cy="157" r="5" fill="#334155"/>
<text x="325" y="195" text-anchor="middle">π/2</text>
<circle cx="325" cy="290" r="57" fill="#eef5fb" stroke="#b5c4d6" stroke-width="2"/>
<line x1="261" y1="290" x2="389" y2="290" stroke="#a4b4c6" stroke-width="1"/>
<line x1="325" y1="226" x2="325" y2="354" stroke="#a4b4c6" stroke-width="1"/>
<line x1="325" y1="290" x2="356.820" y2="321.820" stroke="#2563a8" stroke-width="4" marker-end="url(#blue-arrow)"/>
<text x="325" y="393" text-anchor="middle" font-size="19">(1 − i)/√2</text>
<circle cx="550" cy="157" r="5" fill="#334155"/>
<text x="550" y="195" text-anchor="middle">π</text>
<circle cx="550" cy="290" r="57" fill="#eef5fb" stroke="#b5c4d6" stroke-width="2"/>
<line x1="486" y1="290" x2="614" y2="290" stroke="#a4b4c6" stroke-width="1"/>
<line x1="550" y1="226" x2="550" y2="354" stroke="#a4b4c6" stroke-width="1"/>
<line x1="550" y1="290" x2="550.000" y2="335.000" stroke="#2563a8" stroke-width="4" marker-end="url(#blue-arrow)"/>
<text x="550" y="393" text-anchor="middle" font-size="19">−i</text>
<circle cx="775" cy="157" r="5" fill="#334155"/>
<text x="775" y="195" text-anchor="middle">3π/2</text>
<circle cx="775" cy="290" r="57" fill="#eef5fb" stroke="#b5c4d6" stroke-width="2"/>
<line x1="711" y1="290" x2="839" y2="290" stroke="#a4b4c6" stroke-width="1"/>
<line x1="775" y1="226" x2="775" y2="354" stroke="#a4b4c6" stroke-width="1"/>
<line x1="775" y1="290" x2="743.180" y2="321.820" stroke="#2563a8" stroke-width="4" marker-end="url(#blue-arrow)"/>
<text x="775" y="393" text-anchor="middle" font-size="19">(−1 − i)/√2</text>
<circle cx="1000" cy="157" r="5" fill="#334155"/>
<text x="1000" y="195" text-anchor="middle">2π</text>
<circle cx="1000" cy="290" r="57" fill="#eef5fb" stroke="#b5c4d6" stroke-width="2"/>
<line x1="936" y1="290" x2="1064" y2="290" stroke="#a4b4c6" stroke-width="1"/>
<line x1="1000" y1="226" x2="1000" y2="354" stroke="#a4b4c6" stroke-width="1"/>
<line x1="1000" y1="290" x2="955.000" y2="290.000" stroke="#2563a8" stroke-width="4" marker-end="url(#blue-arrow)"/>
<text x="1000" y="393" text-anchor="middle" font-size="19">−1</text>
<path d="M 100 425 L 100 449 L 1000 449 L 1000 425" stroke="#8b3c93" stroke-width="2" fill="none"/>
<text x="550" y="483" text-anchor="middle" fill="#763180">The base point returns; the fibre multiplier is −1.</text>
<text x="550" y="515" text-anchor="middle" font-size="18">Each small disk is a separate local complex fibre diagram, with the same chosen product frame.</text>
</g></svg>
