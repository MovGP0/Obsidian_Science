<svg xmlns="http://www.w3.org/2000/svg" width="1050" height="490" viewBox="0 0 1050 490" role="img" aria-labelledby="title desc">
<title id="title">An interval with identified endpoints is a circle</title><desc id="desc">A quotient map joins the endpoints zero and L. A circle neighbourhood at the join pulls back to two short interval pieces.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/></marker><marker id="blue-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2563a8"/></marker></defs>
<rect width="100%" height="100%" fill="#ffffff"/>
<g font-family="Arial, sans-serif" font-size="21" fill="#172b44">
<text x="65" y="48" font-size="27" font-weight="bold">Endpoint identification</text>
<text x="65" y="92">Interval [0, L]</text>
<line x1="85" y1="195" x2="430" y2="195" stroke="#334155" stroke-width="5"/>
<line x1="85" y1="195" x2="146" y2="195" stroke="#13877c" stroke-width="13"/>
<line x1="369" y1="195" x2="430" y2="195" stroke="#13877c" stroke-width="13"/>
<circle cx="85" cy="195" r="8" fill="#8b3c93"/><circle cx="430" cy="195" r="8" fill="#8b3c93"/>
<text x="85" y="237" text-anchor="middle">0</text><text x="430" y="237" text-anchor="middle">L</text>
<path d="M 85 170 C 110 115,405 115,430 170" stroke="#8b3c93" stroke-width="2" fill="none"/>
<text x="258" y="122" text-anchor="middle" fill="#8b3c93">0 ∼ L</text>
<path d="M 470 195 L 595 195" stroke="#334155" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
<text x="530" y="165" text-anchor="middle">q</text>
<circle cx="790" cy="235" r="125" stroke="#2563a8" stroke-width="5" fill="none"/>
<path d="M 900 175 A 125 125 0 0 1 900 295" stroke="#13877c" stroke-width="13" fill="none"/>
<circle cx="915" cy="235" r="9" fill="#8b3c93"/>
<text x="790" y="231" text-anchor="middle">[t] ↦ exp(2πit/L)</text>
<text x="790" y="265" text-anchor="middle">S¹</text>
<text x="947" y="228" font-size="18">[0]</text>
<text x="947" y="254" font-size="18">= [L]</text>
<path d="M 804 111 A 125 125 0 0 0 729 126" stroke="#2563a8" stroke-width="3" fill="none" marker-end="url(#blue-arrow)"/>
<text x="65" y="332" font-size="20">Green pieces: inverse image</text>
<text x="65" y="362" font-size="20">of one neighbourhood at the join.</text>
<text x="65" y="418" font-size="20">A real interval has two ends.</text>
<text x="615" y="418" font-size="20">The quotient has no endpoint.</text>
</g></svg>
