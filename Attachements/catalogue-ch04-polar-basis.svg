<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="460" viewBox="0 0 1000 460" role="img" aria-label="Polar coordinate and reciprocal basis">
<rect width="1000" height="460" fill="white"/>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6 Z" fill="context-stroke"/></marker></defs>
<g font-family="Arial, sans-serif" font-size="24" fill="#172033">
<text x="55" y="48" font-size="28">Polar basis at r = 2, θ = 0</text>
<path d="M100 340 H535 M200 380 V85" stroke="#9ca3af" stroke-width="2" fill="none"/>
<path d="M200 340 H420" stroke="#6b7280" stroke-width="3"/><text x="260" y="320">r = 2</text>
<path d="M420 340 V120" stroke="#1d4ed8" stroke-width="5" marker-end="url(#arrow)"/>
<path d="M420 340 V285" stroke="#c2410c" stroke-width="7" marker-end="url(#arrow)"/>
<path d="M420 340 H530" stroke="#15803d" stroke-width="4" marker-end="url(#arrow)"/>
<circle cx="420" cy="340" r="6" fill="#172033"/>
<text x="455" y="135" fill="#1d4ed8">gθ = (0, 2)</text><text x="455" y="285" fill="#c2410c">gᶿ = (0, 1/2)</text>
<text x="550" y="350" fill="#15803d">gᵣ = gʳ = (1, 0)</text><text x="340" y="390">Point (2, 0)</text>
<text x="100" y="435">Reciprocal angular vectors satisfy gᶿ · gθ = 1.</text></g></svg>