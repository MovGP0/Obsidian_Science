<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="480" viewBox="0 0 1000 480" role="img"><rect width="1000" height="480" fill="white"/><g font-family="Arial, sans-serif" font-size="24" fill="#152238">
<text x="50" y="45" font-size="30" font-weight="bold">Add each function value times its interval length</text>
<rect x="150" y="100" width="150" height="220" fill="#d9e9fc"/>
<rect x="300" y="210" width="450" height="110" fill="#d8f1df"/>
<path d="M110 320H820 M150 350V72" stroke="#596574" stroke-width="2"/>
<path d="M150 100H300 M300 210H750" stroke="#2463a5" stroke-width="4" fill="none"/>
<path d="M300 100V320" stroke="#596574" stroke-width="2" stroke-dasharray="6 6"/>
<text x="130" y="109" text-anchor="end">2</text>
<text x="130" y="218" text-anchor="end">1</text>
<text x="150" y="355" text-anchor="middle">0</text>
<text x="300" y="355" text-anchor="middle">1/4</text>
<text x="750" y="355" text-anchor="middle">1</text>
<text x="830" y="328" >t</text>
<text x="167" y="79" >s(t)</text>
<text x="225" y="255" text-anchor="middle">2 × 1/4</text>
<text x="525" y="277" text-anchor="middle">1 × 3/4</text>
<text x="500" y="430" text-anchor="middle" font-size="29">Integral = 2 × 1/4 + 1 × 3/4 = 5/4</text>
</g></svg>