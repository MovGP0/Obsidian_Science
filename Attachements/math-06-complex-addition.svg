<svg xmlns="http://www.w3.org/2000/svg" width="900" height="650" viewBox="0 0 900 650" role="img" aria-label="Complex addition is vector addition">
<defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 Z" fill="#202c3c"/></marker></defs>
<rect width="900" height="650" fill="#ffffff"/>
<g font-family="Arial, sans-serif" font-size="20" fill="#202c3c">
<text x="40" y="42" font-size="27" font-weight="bold">Complex addition is vector addition</text>
<text x="40" y="76" font-size="19">Translate either displacement without changing its direction or length.</text>
<line x1="130" y1="500" x2="730" y2="500" stroke="#202c3c" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="350" y1="550" x2="350" y2="120" stroke="#202c3c" stroke-width="2" marker-end="url(#arrow)"/>
<text x="745" y="507" fill="#202c3c" font-size="20" text-anchor="start">Re</text>
<text x="367" y="125" fill="#202c3c" font-size="20" text-anchor="start">Im</text>
<text x="330" y="525" fill="#202c3c" font-size="20" text-anchor="start">0</text>
<line x1="250" y1="495" x2="250" y2="505" stroke="#202c3c" stroke-width="2"/>
<text x="250" y="532" fill="#202c3c" font-size="17" text-anchor="middle">−1</text>
<line x1="450" y1="495" x2="450" y2="505" stroke="#202c3c" stroke-width="2"/>
<text x="450" y="532" fill="#202c3c" font-size="17" text-anchor="middle">1</text>
<line x1="550" y1="495" x2="550" y2="505" stroke="#202c3c" stroke-width="2"/>
<text x="550" y="532" fill="#202c3c" font-size="17" text-anchor="middle">2</text>
<line x1="650" y1="495" x2="650" y2="505" stroke="#202c3c" stroke-width="2"/>
<text x="650" y="532" fill="#202c3c" font-size="17" text-anchor="middle">3</text>
<line x1="345" y1="400" x2="355" y2="400" stroke="#202c3c" stroke-width="2"/>
<text x="328" y="406" fill="#202c3c" font-size="17" text-anchor="end">1</text>
<line x1="345" y1="300" x2="355" y2="300" stroke="#202c3c" stroke-width="2"/>
<text x="328" y="306" fill="#202c3c" font-size="17" text-anchor="end">2</text>
<line x1="345" y1="200" x2="355" y2="200" stroke="#202c3c" stroke-width="2"/>
<text x="328" y="206" fill="#202c3c" font-size="17" text-anchor="end">3</text>
<line x1="350" y1="500" x2="550" y2="400" stroke="#2459a6" stroke-width="4" marker-end="url(#arrow)"/>
<line x1="350" y1="500" x2="250" y2="300" stroke="#bb5a18" stroke-width="4" marker-end="url(#arrow)"/>
<line x1="550" y1="400" x2="450" y2="200" stroke="#bb5a18" stroke-width="4" marker-end="url(#arrow)"/>
<line x1="250" y1="300" x2="450" y2="200" stroke="#2459a6" stroke-width="3" marker-end="url(#arrow)" stroke-dasharray="7 6"/>
<line x1="350" y1="500" x2="450" y2="200" stroke="#23724e" stroke-width="4" marker-end="url(#arrow)"/>
<circle cx="450" cy="200" r="5" fill="#23724e"/>
<text x="564" y="397" fill="#2459a6" font-size="20" text-anchor="start">z = 2 + i</text>
<text x="120" y="274" fill="#bb5a18" font-size="20" text-anchor="start">w = −1 + 2i</text>
<text x="480" y="195" fill="#23724e" font-size="20" text-anchor="start">z + w = 1 + 3i</text>
<text x="525" y="290" fill="#bb5a18" font-size="18" text-anchor="start">translated w</text>
<text x="433" y="347" fill="#23724e" font-size="18" text-anchor="start">sum</text>
<text x="140" y="605" fill="#202c3c" font-size="22" text-anchor="start">Head to tail:  (2, 1) + (−1, 2) = (1, 3)</text>
</g></svg>