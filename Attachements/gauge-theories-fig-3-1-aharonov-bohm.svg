<svg xmlns="http://www.w3.org/2000/svg" width="800" height="300" viewBox="0 0 800 300">
  <title>Aharonov–Bohm beam experiment</title>
  <desc>A beam splits into paths above and below a solenoid. An obstacle excludes the beam from the central region. The paths join in an interference region.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 L 3 5 Z" fill="#222"/>
    </marker>
  </defs>
  <rect width="800" height="300" fill="white"/>
  <g fill="none" stroke="#222" stroke-width="3">
    <path d="M 40 140 H 145" marker-end="url(#arrow)"/>
    <path d="M 145 140 H 220 C 305 91 361 44 400 44 C 446 44 511 100 605 140 L 652 166"/>
    <path d="M 220 140 C 305 189 361 236 400 236 C 446 236 511 180 605 140 L 652 114"/>
    <path d="M 354 52 Q 379 44 404 44" marker-end="url(#arrow)"/>
    <path d="M 354 228 Q 379 236 404 236" marker-end="url(#arrow)"/>
    <circle cx="400" cy="140" r="30" stroke-width="5"/>
    <path d="M 310 87 V 193" stroke="#888" stroke-width="6"/>
    <path d="M 346 263 C 324 244 323 222 325 209 C 329 191 354 220 354 204 C 354 188 331 174 323 174" stroke-width="1.5" marker-end="url(#arrow)"/>
  </g>
  <g font-family="Arial, sans-serif" font-size="24" fill="#222" text-anchor="middle">
    <text x="110" y="176">beam</text>
    <text x="400" y="96">solenoid</text>
    <text x="413" y="278">obstacle</text>
    <text x="725" y="139">interference</text>
    <text x="725" y="168">region</text>
  </g>
</svg>
