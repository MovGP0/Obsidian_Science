<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="620" viewBox="0 0 1000 620" role="img" aria-labelledby="title desc">
<title id="title">Three questions about two cubed equals eight</title>
<desc id="desc">Power finds eight from base two and exponent three. Cube root finds base two from eight and exponent three. The base-two logarithm finds exponent three from base two and eight.</desc>
<rect width="1000" height="620" fill="white"/>
<g font-family="Arial, sans-serif" fill="#17212b" text-anchor="middle">
<text x="500" y="48" font-size="29" font-weight="bold">One relationship: 2³ = 8</text>
<text x="500" y="89" font-size="22">Choose the operation from the missing number.</text>
<rect x="42" y="128" width="290" height="357" rx="12" fill="#eaf2fc" stroke="#225a95" stroke-width="2"/>
<rect x="355" y="128" width="290" height="357" rx="12" fill="#f0f5ec" stroke="#456d30" stroke-width="2"/>
<rect x="668" y="128" width="290" height="357" rx="12" fill="#faf0e6" stroke="#9a581e" stroke-width="2"/>
<text x="187" y="170" font-size="25" font-weight="bold">POWER</text><text x="500" y="170" font-size="25" font-weight="bold">ROOT</text><text x="813" y="170" font-size="25" font-weight="bold">LOGARITHM</text>
<text x="187" y="217" font-size="22">Known: base 2</text><text x="187" y="249" font-size="22">and exponent 3</text>
<text x="500" y="217" font-size="22">Known: result 8</text><text x="500" y="249" font-size="22">and exponent 3</text>
<text x="813" y="217" font-size="22">Known: base 2</text><text x="813" y="249" font-size="22">and result 8</text>
<text x="187" y="316" font-size="34">2³ = ?</text><text x="500" y="316" font-size="34">?³ = 8</text><text x="813" y="316" font-size="34">2ˣ = 8</text>
<path d="M 187 337 V 373 M 500 337 V 373 M 813 337 V 373" stroke="#52606b" stroke-width="3"/>
<path d="m 180 365 7 9 7 -9 M 493 365 l 7 9 7 -9 M 806 365 l 7 9 7 -9" fill="none" stroke="#52606b" stroke-width="3"/>
<text x="187" y="418" font-size="32">2³ = 8</text><text x="500" y="418" font-size="32">∛8 = 2</text><text x="813" y="418" font-size="32">log₂ 8 = 3</text>
<text x="187" y="459" font-size="22">Find the result.</text><text x="500" y="459" font-size="22">Find the base.</text><text x="813" y="459" font-size="22">Find the exponent.</text>
<text x="500" y="542" font-size="22">For real logarithms: base b &gt; 0, b ≠ 1; argument y &gt; 0.</text>
<text x="500" y="581" font-size="22">Even roots require a principal-value convention; this example uses a cube root.</text>
</g></svg>