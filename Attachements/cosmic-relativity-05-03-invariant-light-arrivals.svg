<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="420" viewBox="0 0 1040 420" role="img" aria-labelledby="title desc">
  <title id="title">Invariant light speeds in the source simultaneity argument</title>
  <desc id="desc">Two events A and B flank midpoint M. The source compares observers O and O prime in relative motion and assigns the same light speed c to signals arriving from both directions in each observer frame. The rows represent the source argument and are separated for clarity.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#34465e"/></marker>
    <g id="event"><circle r="16" fill="#f8d64e" stroke="#b22222" stroke-width="2"/></g>
  </defs>
  <rect width="1040" height="420" rx="16" fill="#fff"/>
  <g font-family="Arial, sans-serif" fill="#172033">
    <use href="#event" x="100" y="130"/><use href="#event" x="940" y="130"/>
    <use href="#event" x="100" y="300"/><use href="#event" x="940" y="300"/>
    <g fill="none" stroke="#34465e" stroke-width="3" marker-end="url(#arrow)">
      <path d="M 130 130 H 475 M 910 130 H 565" stroke-dasharray="8 6"/>
      <path d="M 130 300 H 475 M 910 300 H 565"/>
      <path d="M 75 75 H 135 M 915 75 H 975 M 550 190 H 490 M 490 235 H 550"/>
    </g>
    <g fill="#c0c9d3" stroke="#34465e" stroke-width="2">
      <circle cx="520" cy="108" r="15"/><path d="M 505 130 L 492 175 H 548 L 535 130 Z"/>
      <circle cx="520" cy="278" r="15"/><path d="M 505 300 L 492 345 H 548 L 535 300 Z"/>
    </g>
    <g text-anchor="middle" font-size="25">
      <text x="100" y="185">A</text><text x="940" y="185">B</text>
      <text x="100" y="355">A</text><text x="940" y="355">B</text>
      <text x="300" y="106">c</text><text x="750" y="106">c</text>
      <text x="300" y="340">c</text><text x="750" y="340">c</text>
      <text x="560" y="135">O</text><text x="560" y="305">O′</text>
      <text x="520" y="208">M</text>
      <text x="100" y="53">v</text><text x="940" y="53">v</text>
    </g>
    <text x="570" y="239" font-size="22">v</text>
    <text x="520" y="400" text-anchor="middle" font-size="18" fill="#566174">The observers coincide at M when the events occur; the rows are separated for clarity.</text>
  </g>
</svg>
