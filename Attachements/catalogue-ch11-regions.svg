<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="610" viewBox="0 0 1000 610" role="img">
<rect width="1000" height="610" fill="white"/>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#1e293b"/></marker></defs>
<g font-family="Segoe UI, Arial, sans-serif" font-size="24" fill="#172033">
<title>Fredholm square and Volterra triangular integration regions</title>
<text x="250" y="55" text-anchor="middle" font-size="29" font-weight="bold">Fredholm: fixed limits</text>
<text x="750" y="55" text-anchor="middle" font-size="29" font-weight="bold">Volterra: variable limit</text>
<rect x="100" y="140" width="300" height="300" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
<path d="M600 440 L900 440 L900 140 Z" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
<path d="M100 120 V440 H430 M600 120 V440 H930" fill="none" stroke="#1e293b" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M100 440V110 M600 440V110" fill="none" stroke="#1e293b" stroke-width="2" marker-end="url(#arrow)"/>
<text x="81" y="470">0</text><text x="581" y="470">0</text>
<text x="390" y="475">1</text><text x="890" y="475">1</text>
<text x="65" y="150">1</text><text x="565" y="150">1</text>
<text x="440" y="449">x</text><text x="940" y="449">x</text>
<text x="83" y="105">t</text><text x="583" y="105">t</text>
<path d="M295 440V140" stroke="#1d4ed8" stroke-width="8"/>
<path d="M795 440V245" stroke="#15803d" stroke-width="8"/>
<path d="M795 245V140" stroke="#64748b" stroke-width="2" stroke-dasharray="8 8"/>
<text x="320" y="295" fill="#1d4ed8">0 ≤ t ≤ 1</text>
<text x="640" y="365" fill="#166534">0 ≤ t ≤ x</text>
<text x="765" y="195" transform="rotate(-45 765 195)">t = x</text>
<text x="250" y="525" text-anchor="middle">Each output uses all inputs.</text>
<text x="750" y="525" text-anchor="middle">Each output uses inputs t ≤ x.</text>
<text x="500" y="575" text-anchor="middle" fill="#475569">The thick vertical segment is the integral at one fixed x.</text>
</g></svg>