<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="420" viewBox="0 0 1000 420" role="img">
<rect width="1000" height="420" fill="white"/>
<g font-family="Arial, sans-serif" font-size="24" fill="#172033">
<text x="55" y="48" font-size="28" font-weight="bold">An alternating sum gives an interval for its limit</text>
<text x="55" y="95">A = 1 − 1/2 + 1/3 − 1/4 + 1/5 − …</text>
<rect x="180" y="155" width="640" height="75" rx="8" fill="#e6f1fb"/>
<line x1="90" y1="200" x2="910" y2="200" stroke="#172033" stroke-width="3"/>
<line x1="180" y1="178" x2="180" y2="222" stroke="#2456a6" stroke-width="5"/>
<line x1="820" y1="178" x2="820" y2="222" stroke="#2456a6" stroke-width="5"/>
<circle cx="500" cy="200" r="9" fill="#b45309"/>
<text x="180" y="265" text-anchor="middle">S₄ = 7/12</text>
<text x="820" y="265" text-anchor="middle">S₅ = 47/60</text>
<text x="500" y="145" text-anchor="middle">S₄ ≤ A ≤ S₅</text>
<text x="500" y="302" text-anchor="middle" fill="#b45309">Midpoint = 41/60</text>
<text x="55" y="355">Interval width: 1/5</text>
<text x="500" y="355">Midpoint error: at most 1/10</text>
<text x="55" y="397" font-size="21">The marked point is an approximation, not the exact sum.</text>
</g></svg>