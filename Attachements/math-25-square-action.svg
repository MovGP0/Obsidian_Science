<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600"><rect width="1000" height="600" fill="#fff"/><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#245b8a"/></marker></defs><g font-family="Arial, sans-serif" font-size="22" fill="#172b3a">
<text x="55" y="48" font-size="28" font-weight="bold">A square action: orbit and stabilizer</text>
<path d="M140 130H480V470H140Z" fill="#edf4fa" stroke="#334b60" stroke-width="3"/>
<path d="M120 490L525 85" stroke="#c47818" stroke-width="3" stroke-dasharray="10 7"/>
<text x="420" y="86" fill="#9a5a0b">y = x</text>
<circle cx="480" cy="130" r="10" fill="#bd3f3f"/><circle cx="140" cy="130" r="8" fill="#245b8a"/>
<circle cx="140" cy="470" r="8" fill="#245b8a"/><circle cx="480" cy="470" r="8" fill="#245b8a"/>
<text x="520" y="145" fill="#a52b2b">v = (1, 1)</text><text x="62" y="119">(−1, 1)</text>
<text x="45" y="504">(−1, −1)</text><text x="465" y="510">(1, −1)</text>
<path d="M420 170 Q310 95 195 170" fill="none" stroke="#245b8a" stroke-width="3" marker-end="url(#arrow)"/>
<text x="230" y="198" fill="#245b8a">quarter turn</text>
<circle cx="310" cy="300" r="6" fill="#172b3a"/><text x="326" y="307">center</text>
<text x="620" y="215" font-weight="bold">Orbit of v</text><text x="620" y="252">All four vertices</text>
<text x="620" y="320" font-weight="bold">Stabilizer of v</text><text x="620" y="357">Identity</text>
<text x="620" y="394">Reflection in y = x</text>
<text x="620" y="468" font-size="27">8 / 2 = 4 orbit points</text>
<text x="55" y="563">The center is fixed by all eight symmetries; its orbit has one point.</text>
</g></svg>