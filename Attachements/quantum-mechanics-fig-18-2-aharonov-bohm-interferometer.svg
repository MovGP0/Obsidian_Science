<svg xmlns="http://www.w3.org/2000/svg" width="720" height="250" viewBox="0 0 720 250" role="img" aria-labelledby="title desc">
  <title id="title">Magnetic Aharonov–Bohm interferometer</title>
  <desc id="desc">Electrons travel from a source through a double slit. The two paths pass on opposite sides of a solenoid with field out of the page and overlap at the screen.</desc>
