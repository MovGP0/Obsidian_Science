<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="650" viewBox="0 0 1000 650" role="img" aria-labelledby="title">
<title id="title">A linear program and its unique optimal vertex</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="context-stroke"/></marker></defs>
<rect width="1000" height="650" fill="white"/>
<g font-family="Arial, sans-serif" font-size="24" fill="#18242e">

<text x="60" y="48" font-size="30" font-weight="bold">Maximize 3x + 2y over the shaded polygon</text>
<polygon points="90,570 290,570 290,370 90,170" fill="#d8ecf8" stroke="#165f8c" stroke-width="3"/>
<line x1="90" y1="570" x2="550" y2="570" stroke="#263238" stroke-width="3" marker-end="url(#arrow)"/>
<line x1="90" y1="570" x2="90" y2="110" stroke="#263238" stroke-width="3" marker-end="url(#arrow)"/>
<line x1="90" y1="170" x2="490" y2="570" stroke="#165f8c" stroke-width="3"/>
<line x1="290" y1="125" x2="290" y2="570" stroke="#165f8c" stroke-width="3"/>
<line x1="170" y1="190" x2="410" y2="550" stroke="#ab4b00" stroke-width="4"/>
<circle cx="290" cy="370" r="8" fill="#ab4b00"/>
<text x="315" y="365" font-weight="bold">(2, 2)</text>
<text x="57" y="602">0</text><text x="276" y="602">2</text><text x="476" y="602">4</text>
<text x="56" y="378">2</text><text x="56" y="178">4</text>
<text x="558" y="579">x</text><text x="79" y="98">y</text>
<text x="310" y="151">x = 2</text>
<text x="120" y="196">x + y = 4</text>
<text x="115" y="460">Feasible</text><text x="115" y="491">region</text>
<rect x="590" y="190" width="350" height="270" rx="15" fill="#fff7ef" stroke="#ab4b00" stroke-width="2"/>
<text x="615" y="232" font-weight="bold">Supporting objective line</text>
<text x="615" y="278">3x + 2y = 10</text>
<text x="615" y="326">For every feasible point:</text>
<text x="615" y="369">3x + 2y = 2(x + y) + x</text>
<text x="615" y="412">≤ 2·4 + 2 = 10</text>

</g></svg>