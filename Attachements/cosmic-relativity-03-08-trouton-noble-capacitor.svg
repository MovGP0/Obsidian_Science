<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="600" viewBox="0 0 1120 600" role="img" aria-labelledby="title desc">
  <title id="title">Trouton-Noble suspended capacitor and its orientations</title>
  <desc id="desc">A charged capacitor hangs from a fibre. Its normal and velocity are shown. Two other panels compare plates perpendicular and parallel to the velocity, with the electric field and separation labelled. The source predicts an orientation-dependent energy and a torque, but reports no observed rotation.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#34465e"/>
    </marker>
    <marker id="electric" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b22222"/>
    </marker>
  </defs>
  <rect width="1120" height="600" rx="16" fill="#fff"/>
  <g font-family="Arial, sans-serif" fill="#172033">
    <g font-size="22" font-weight="bold" text-anchor="middle">
      <text x="190" y="40">a — Suspended capacitor</text>
      <text x="580" y="40">b — Plates normal to v</text>
      <text x="960" y="40">c — Plates parallel to v</text>
    </g>
    <line x1="190" y1="70" x2="190" y2="220" stroke="#34465e" stroke-width="2"/>
    <polygon points="70,285 285,200 285,435 70,520" fill="#5e8ab8" stroke="#1f4e8c" stroke-width="2"/>
    <polygon points="105,305 320,220 320,455 105,540" fill="#a8c8e2" fill-opacity="0.8" stroke="#1f4e8c" stroke-width="2"/>
    <line x1="210" y1="370" x2="355" y2="385" stroke="#34465e" stroke-width="3" marker-end="url(#arrow)"/>
    <line x1="210" y1="370" x2="285" y2="455" stroke="#34465e" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="340" y="365" font-size="26">v</text>
    <text x="285" y="485" font-size="25">n̂</text>
    <g fill="#e8edf3" stroke="#526780" stroke-width="2">
      <rect x="410" y="300" width="335" height="10"/>
      <rect x="410" y="375" width="335" height="10"/>
      <rect x="900" y="180" width="10" height="300"/>
      <rect x="1010" y="180" width="10" height="300"/>
    </g>
    <g stroke="#b22222" stroke-width="2.5" marker-end="url(#electric)">
      <line x1="445" y1="365" x2="445" y2="320"/>
      <line x1="510" y1="365" x2="510" y2="320"/>
      <line x1="640" y1="365" x2="640" y2="320"/>
      <line x1="705" y1="365" x2="705" y2="320"/>
      <line x1="1000" y1="230" x2="925" y2="230"/>
      <line x1="1000" y1="300" x2="925" y2="300"/>
      <line x1="1000" y1="370" x2="925" y2="370"/>
      <line x1="1000" y1="440" x2="925" y2="440"/>
    </g>
    <g stroke="#34465e" stroke-width="3" marker-end="url(#arrow)">
      <line x1="580" y1="350" x2="580" y2="195"/>
      <line x1="960" y1="265" x2="960" y2="115"/>
    </g>
    <g font-size="24" text-anchor="middle">
      <text x="600" y="205">v</text>
      <text x="985" y="125">v</text>
      <text x="460" y="285">+</text><text x="530" y="285">+</text><text x="630" y="285">+</text><text x="700" y="285">+</text>
      <text x="460" y="415">−</text><text x="530" y="415">−</text><text x="630" y="415">−</text><text x="700" y="415">−</text>
      <text x="880" y="230">+</text><text x="880" y="300">+</text><text x="880" y="370">+</text><text x="880" y="440">+</text>
      <text x="1040" y="230">−</text><text x="1040" y="300">−</text><text x="1040" y="370">−</text><text x="1040" y="440">−</text>
      <text x="580" y="465">d√(1 − v²/c²)</text>
      <text x="960" y="520">d</text>
    </g>
    <text x="560" y="580" text-anchor="middle" font-size="18" fill="#566174">Source orientation and contraction model; the experiment reported no turning effect.</text>
  </g>
</svg>
