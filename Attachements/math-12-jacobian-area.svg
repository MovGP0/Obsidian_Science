<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="480" viewBox="0 0 1000 480">
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#334155"/></marker></defs>
<rect width="1000" height="480" fill="white"/>
<g font-family="Arial, sans-serif" fill="#0f172a">
<text x="500" y="35" text-anchor="middle" font-size="24">A Jacobian determinant measures area scaling</text>
<text x="240" y="77" text-anchor="middle" font-size="19">Input square in (u, v)</text>
<text x="744" y="77" text-anchor="middle" font-size="19">Output parallelogram in (x, y)</text>
<path d="M105,360 H390 M145,400 V120" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M105,360 H390" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
<polygon points="145,360 325,360 325,180 145,180" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5"/>
<text x="235" y="266" text-anchor="middle" font-size="19">Area = 1</text>
<text x="134" y="383" text-anchor="end" font-size="16">0</text>
<text x="325" y="383" text-anchor="middle" font-size="16">1</text>
<text x="129" y="186" text-anchor="end" font-size="16">1</text>
<text x="396" y="366" font-size="18">u</text><text x="138" y="111" font-size="18">v</text>
<path d="M432,252 H544" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
<text x="488" y="218" text-anchor="middle" font-size="16">T(u, v)</text>
<path d="M585,370 H938" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M615,400 V105" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
<polygon points="615,370 795,280 885,100 705,190" fill="#dcfce7" stroke="#059669" stroke-width="2.5"/>
<path d="M615,370 L795,280" stroke="#334155" stroke-width="2.4" marker-end="url(#arrow)"/>
<path d="M615,370 L705,190" stroke="#334155" stroke-width="2.4" marker-end="url(#arrow)"/>
<text x="755" y="235" text-anchor="middle" font-size="19">Area = 3</text>
<text x="806" y="295" font-size="16">(2, 1)</text>
<text x="687" y="177" text-anchor="end" font-size="16">(1, 2)</text>
<text x="890" y="92" font-size="16">(3, 3)</text>
<text x="603" y="389" text-anchor="end" font-size="16">(0, 0)</text>
<text x="946" y="377" font-size="18">x</text><text x="607" y="96" font-size="18">y</text>
<text x="500" y="435" text-anchor="middle" font-size="18">x = 2u + v,   y = u + 2v;   det DT = 2·2 − 1·1 = 3</text>
</g></svg>