<rect width="1000" height="620" fill="white"/>
<style>text{font-family:Arial,sans-serif;fill:#182332;font-size:22px}.title{font-size:28px;font-weight:bold}.small{font-size:20px}.blue{fill:#205e9b}.orange{fill:#a84d00}</style>
<title id="title">Compare equal principal and equal total payments</title>
<desc id="desc">Three-year loan of 1200 euros at ten percent yearly interest. Left bars have principal of 400 each and payments of 520, 480, 440. Right bars have equal payments of about 482.54 with decreasing interest.</desc>
<text class="title" x="45" y="45">A €1,200 loan: two ways to repay in three years</text>
<text x="45" y="82">10% yearly interest; payments at year ends; no fees</text>
<rect x="47" y="113" width="22" height="22" fill="#205e9b"/><text x="80" y="132">Principal repaid</text>
<rect x="292" y="113" width="22" height="22" fill="#d9a67b"/><text x="325" y="132">Interest</text>
<text x="245" y="183" text-anchor="middle">Equal principal</text><text x="747" y="183" text-anchor="middle">Equal total payments</text>
<line x1="498" y1="165" x2="498" y2="493" stroke="#bac4ce" stroke-width="2"/>
<rect x="60" y="282.000" width="82" height="180.000" fill="#205e9b"/><rect x="60" y="228.000" width="82" height="54.000" fill="#d9a67b"/><text class="small" x="101" y="215.000" text-anchor="middle">€520.00</text><text class="small" style="fill:white" x="101" y="379.000" text-anchor="middle">400.00</text><text class="small" x="101" y="491" text-anchor="middle">Year 1</text><rect x="186" y="282.000" width="82" height="180.000" fill="#205e9b"/><rect x="186" y="246.000" width="82" height="36.000" fill="#d9a67b"/><text class="small" x="227" y="233.000" text-anchor="middle">€480.00</text><text class="small" style="fill:white" x="227" y="379.000" text-anchor="middle">400.00</text><text class="small" x="227" y="491" text-anchor="middle">Year 2</text><rect x="312" y="282.000" width="82" height="180.000" fill="#205e9b"/><rect x="312" y="264.000" width="82" height="18.000" fill="#d9a67b"/><text class="small" x="353" y="251.000" text-anchor="middle">€440.00</text><text class="small" style="fill:white" x="353" y="379.000" text-anchor="middle">400.00</text><text class="small" x="353" y="491" text-anchor="middle">Year 3</text><rect x="560" y="298.858" width="82" height="163.142" fill="#205e9b"/><rect x="560" y="244.858" width="82" height="54.000" fill="#d9a67b"/><text class="small" x="601" y="231.858" text-anchor="middle">€482.54</text><text class="small" style="fill:white" x="601" y="387.429" text-anchor="middle">362.54</text><text class="small" x="601" y="491" text-anchor="middle">Year 1</text><rect x="686" y="282.544" width="82" height="179.456" fill="#205e9b"/><rect x="686" y="244.858" width="82" height="37.686" fill="#d9a67b"/><text class="small" x="727" y="231.858" text-anchor="middle">€482.54</text><text class="small" style="fill:white" x="727" y="379.272" text-anchor="middle">398.79</text><text class="small" x="727" y="491" text-anchor="middle">Year 2</text><rect x="812" y="264.598" width="82" height="197.402" fill="#205e9b"/><rect x="812" y="244.858" width="82" height="19.740" fill="#d9a67b"/><text class="small" x="853" y="231.858" text-anchor="middle">€482.54</text><text class="small" style="fill:white" x="853" y="370.299" text-anchor="middle">438.67</text><text class="small" x="853" y="491" text-anchor="middle">Year 3</text><rect x="45" y="526" width="910" height="58" rx="8" fill="#eef4fa"/>
