<svg xmlns="http://www.w3.org/2000/svg" width="1050" height="390" viewBox="0 0 1050 390" role="img" aria-labelledby="title desc">
  <title id="title">Coincident sound and light pulses in a loop</title>
  <desc id="desc">Sound and light start together at E and later meet a moving detector at R. Parallel black outlines represent many light circuits, while a red outline represents one sound circuit. The same-event position and time differences between pulses vanish at emission and reception.</desc>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#263238"/></marker><marker id="red-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#b71c1c"/></marker></defs>
  <rect width="1050" height="390" fill="white"/>
  <rect x="58" y="45" width="930" height="201" fill="#fafafa" stroke="#a5a088" stroke-width="5"/>
  <g fill="none" stroke="#263238" stroke-width="2"><rect x="90" y="65" width="866" height="153"/><rect x="94" y="69" width="858" height="145"/><rect x="98" y="73" width="850" height="137"/><rect x="102" y="77" width="842" height="129"/><rect x="106" y="81" width="834" height="121"/></g>
  <path d="M315 226 H88 V91 H945 V226 H455" fill="none" stroke="#b71c1c" stroke-width="4" marker-end="url(#red-arrow)"/>
  <path d="M325 206 H452" fill="none" stroke="#263238" stroke-width="3" marker-end="url(#arrow)"/>
  <g font-family="Arial, sans-serif" font-size="23" fill="#18242b">
    <rect x="309" y="190" width="12" height="54" fill="#e3f2fd" stroke="#263238" stroke-width="2"/><rect x="459" y="190" width="12" height="54" fill="#e3f2fd" stroke="#263238" stroke-width="2"/>
    <text x="315" y="279" text-anchor="middle">E</text><text x="465" y="279" text-anchor="middle">R</text><text x="490" y="182">O′</text><text x="560" y="279">O</text>
    <text x="390" y="139" text-anchor="middle" font-size="29">Δx = Δt = 0</text><path d="M352 150 L319 184 M428 150 L461 184" fill="none" stroke="#263238" stroke-width="2" marker-end="url(#arrow)"/>
    <path d="M321 297 H459" fill="none" stroke="#263238" stroke-width="2" marker-end="url(#arrow)"/><text x="390" y="328" text-anchor="middle">d = vt</text>
    <path d="M646 282 H701" stroke="#b71c1c" stroke-width="4"/><text x="714" y="290">Sound: one circuit</text>
    <path d="M646 317 H701" stroke="#263238" stroke-width="4"/><text x="714" y="325">Light: N circuits</text>
    <text x="525" y="374" text-anchor="middle">Coincidence is local at E and at R for every observer.</text>
  </g>
</svg>
