<svg xmlns="http://www.w3.org/2000/svg" width="1150" height="500" viewBox="0 0 1150 500" role="img" aria-labelledby="title desc">
  <title id="title">Tidal gravity distinguished from uniform frame acceleration</title>
  <desc id="desc">Side-by-side falling bodies converge toward a central mass, vertically separated bodies separate as they fall, and free bodies in a uniformly accelerating box retain their separation.</desc>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#253544"/></marker></defs>
  <rect width="1150" height="500" fill="white"/>
  <g font-family="Arial, sans-serif" fill="#253544" font-size="21">
    <text x="30" y="37" font-weight="bold">(a1) Horizontal convergence</text><text x="400" y="37" font-weight="bold">(a2) Vertical separation</text><text x="795" y="37" font-weight="bold">(b) Accelerated frame</text>
    <path d="M20 408 Q355 265 705 408" fill="#c6c99e" stroke="#7b805d" stroke-width="2"/>
    <rect x="70" y="85" width="236" height="255" rx="22" fill="none" stroke="#253544" stroke-width="3"/>
    <circle cx="126" cy="130" r="16" fill="#81793b"/><circle cx="250" cy="130" r="16" fill="#a5aeb7"/>
    <path d="M126 155 L157 276 M250 155 L219 276" fill="none" stroke="#253544" stroke-width="2" marker-end="url(#arrow)"/>
    <circle cx="162" cy="299" r="16" fill="#81793b" opacity="0.4"/><circle cx="214" cy="299" r="16" fill="#a5aeb7" opacity="0.4"/>
    <text x="181" y="222" font-style="italic">g</text>
    <rect x="420" y="85" width="236" height="255" rx="22" fill="none" stroke="#253544" stroke-width="3"/>
    <circle cx="536" cy="120" r="16" fill="#81793b"/><circle cx="536" cy="163" r="16" fill="#a5aeb7"/>
    <path d="M501 144 V237 M575 187 V291" fill="none" stroke="#253544" stroke-width="2" marker-end="url(#arrow)"/>
    <circle cx="536" cy="254" r="16" fill="#81793b" opacity="0.4"/><circle cx="536" cy="319" r="16" fill="#a5aeb7" opacity="0.4"/>
    <path d="M750 70 V418" stroke="#7c8792" stroke-dasharray="8 7"/>
    <rect x="820" y="100" width="225" height="250" rx="22" fill="none" stroke="#87939e" stroke-width="2" stroke-dasharray="8 7"/>
    <rect x="820" y="175" width="225" height="250" rx="22" fill="none" stroke="#253544" stroke-width="3"/>
    <circle cx="871" cy="219" r="16" fill="#81793b"/><circle cx="993" cy="219" r="16" fill="#a5aeb7"/>
    <path d="M871 282 V385 M993 282 V385 M789 251 V128" fill="none" stroke="#253544" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="766" y="187" font-style="italic">a</text><text x="891" y="272" font-style="italic">g′ = −a</text>
    <text x="81" y="466" font-size="19">Tidal effects change the separation of freely falling bodies.</text>
    <text x="807" y="466" font-size="19">Separation remains constant.</text>
  </g>
</svg>
