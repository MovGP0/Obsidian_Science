<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="650" viewBox="0 0 1000 650">
<rect width="1000" height="650" fill="#ffffff"/>
<style>text {font-family:Arial, sans-serif;fill:#172033;font-size:20px} .title {font-size:27px;font-weight:bold} .small {font-size:17px} .blue {fill:#2455a4} .green {fill:#16745a}</style>
<defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#172033"/></marker><marker id="blue-arrow" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#2455a4"/></marker><clipPath id="plot"><rect x="70" y="100" width="300" height="450"/></clipPath></defs>
<text x="40" y="45" class="title">A covector assigns values to vectors</text>
<text x="40" y="77">α(x, y) = 2x − y</text>
<line x1="70" y1="100" x2="70" y2="550" stroke="#e1e7ee"/>
<text x="70" y="475" text-anchor="middle" class="small">-1</text>
<line x1="120" y1="100" x2="120" y2="550" stroke="#e1e7ee"/>
<line x1="170" y1="100" x2="170" y2="550" stroke="#e1e7ee"/>
<text x="170" y="475" text-anchor="middle" class="small">1</text>
<line x1="220" y1="100" x2="220" y2="550" stroke="#e1e7ee"/>
<text x="220" y="475" text-anchor="middle" class="small">2</text>
<line x1="270" y1="100" x2="270" y2="550" stroke="#e1e7ee"/>
<text x="270" y="475" text-anchor="middle" class="small">3</text>
<line x1="320" y1="100" x2="320" y2="550" stroke="#e1e7ee"/>
<text x="320" y="475" text-anchor="middle" class="small">4</text>
<line x1="370" y1="100" x2="370" y2="550" stroke="#e1e7ee"/>
<text x="370" y="475" text-anchor="middle" class="small">5</text>
<line x1="70" y1="550" x2="370" y2="550" stroke="#e1e7ee"/>
<text x="105" y="556" text-anchor="end" class="small">-2</text>
<line x1="70" y1="500" x2="370" y2="500" stroke="#e1e7ee"/>
<text x="105" y="506" text-anchor="end" class="small">-1</text>
<line x1="70" y1="450" x2="370" y2="450" stroke="#e1e7ee"/>
<line x1="70" y1="400" x2="370" y2="400" stroke="#e1e7ee"/>
<text x="105" y="406" text-anchor="end" class="small">1</text>
<line x1="70" y1="350" x2="370" y2="350" stroke="#e1e7ee"/>
<text x="105" y="356" text-anchor="end" class="small">2</text>
<line x1="70" y1="300" x2="370" y2="300" stroke="#e1e7ee"/>
<text x="105" y="306" text-anchor="end" class="small">3</text>
<line x1="70" y1="250" x2="370" y2="250" stroke="#e1e7ee"/>
<text x="105" y="256" text-anchor="end" class="small">4</text>
<line x1="70" y1="200" x2="370" y2="200" stroke="#e1e7ee"/>
<text x="105" y="206" text-anchor="end" class="small">5</text>
<line x1="70" y1="150" x2="370" y2="150" stroke="#e1e7ee"/>
<text x="105" y="156" text-anchor="end" class="small">6</text>
<line x1="70" y1="100" x2="370" y2="100" stroke="#e1e7ee"/>
<text x="105" y="106" text-anchor="end" class="small">7</text>
<line x1="60" y1="450" x2="395" y2="450" stroke="#172033" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="120" y1="565" x2="120" y2="90" stroke="#172033" stroke-width="2" marker-end="url(#arrow)"/>
<text x="400" y="457">x</text><text x="130" y="106">y</text>
<text x="107" y="475" class="small">0</text>
<line x1="-130" y1="850" x2="520" y2="-450" stroke="#8c5fa6" stroke-width="3" clip-path="url(#plot)"/>
<line x1="-130" y1="950" x2="520" y2="-350" stroke="#16745a" stroke-width="3" clip-path="url(#plot)"/>
<line x1="-130" y1="1050" x2="520" y2="-250" stroke="#2455a4" stroke-width="3" clip-path="url(#plot)"/>
<line x1="-130" y1="1150" x2="520" y2="-150" stroke="#bf6530" stroke-width="3" clip-path="url(#plot)"/>
<line x1="120" y1="450" x2="270" y2="250" stroke="#172033" stroke-width="3" marker-end="url(#arrow)"/>
<circle cx="270" cy="250" r="5" fill="#172033"/>
<rect x="278" y="218" width="106" height="28" fill="#ffffff" opacity="0.94"/>
<text x="283" y="239" class="small">v = (3, 4)</text>
<text x="455" y="135" class="title">Parallel level lines</text>
<line x1="455" y1="179" x2="505" y2="179" stroke="#8c5fa6" stroke-width="4"/><text x="525" y="185">α = −2</text>
<line x1="455" y1="230" x2="505" y2="230" stroke="#16745a" stroke-width="4"/><text x="525" y="236">α = 0   (kernel)</text>
<line x1="455" y1="281" x2="505" y2="281" stroke="#2455a4" stroke-width="4"/><text x="525" y="287">α = 2</text>
<line x1="455" y1="332" x2="505" y2="332" stroke="#bf6530" stroke-width="4"/><text x="525" y="338">α = 4</text>
<text x="455" y="425">α(v) = 2 · 3 − 4 = 2</text>
<text x="455" y="468" class="small">All vectors ending on the blue line</text>
<text x="455" y="495" class="small">have the same covector value.</text>
<text x="455" y="548" class="small">The green line contains every vector</text>
<text x="455" y="575" class="small">that α sends to zero.</text>
<text x="40" y="620" class="small">Evaluation uses the endpoint coordinates; it does not require an inner product.</text>
</svg>