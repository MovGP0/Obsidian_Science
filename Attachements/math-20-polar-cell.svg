<text x="335.64002462952897" y="357.11925194741815" fill="#167a93" font-size="19" text-anchor="middle" font-weight="normal">Δr</text>
<text x="232.6786416876596" y="306.38563220172824" fill="#167a93" font-size="18" text-anchor="middle" font-weight="normal">r Δθ</text>
<rect x="555" y="95" width="435" height="370" rx="14" fill="#f7f9fc" stroke="#d4dce5"/>
<text x="772" y="133" fill="#243247" font-size="21" text-anchor="middle" font-weight="normal">At P = (r, θ), with r > 0</text>
<text x="772" y="184" fill="#167a93" font-size="22" text-anchor="middle" font-weight="normal">g(∂r, ∂r) = 1</text>
<text x="772" y="226" fill="#167a93" font-size="22" text-anchor="middle" font-weight="normal">g(∂θ, ∂θ) = r²</text>
<text x="772" y="268" fill="#167a93" font-size="22" text-anchor="middle" font-weight="normal">g(∂r, ∂θ) = 0</text>
<text x="772" y="323" fill="#243247" font-size="23" text-anchor="middle" font-weight="normal">ds² = dr² + r² dθ²</text>
<text x="772" y="373" fill="#243247" font-size="23" text-anchor="middle" font-weight="normal">√det G = r</text>
<text x="772" y="424" fill="#ba5f15" font-size="23" text-anchor="middle" font-weight="normal">Area ≈ r Δr Δθ</text>
<text x="515" y="513" fill="#243247" font-size="18" text-anchor="middle" font-weight="normal">The tangent arrows show directions; they are drawn with convenient lengths.</text>
<text x="515" y="541" fill="#243247" font-size="18" text-anchor="middle" font-weight="normal">The area approximation is the leading term as the coordinate cell becomes small.</text>
