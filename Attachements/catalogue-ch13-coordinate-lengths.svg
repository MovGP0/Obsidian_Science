<text x="755" y="424" text-anchor="middle" class="">Angular scale factor: hφ = ρ</text>
<text x="500" y="582" text-anchor="middle" class="small">For a scalar f: the azimuthal gradient component is (1/ρ) ∂f/∂φ.</text>
