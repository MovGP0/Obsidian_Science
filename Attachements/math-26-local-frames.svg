<g font-family="Segoe UI, Arial, sans-serif"><text x="500" y="42" font-size="28" fill="#17233b" text-anchor="middle">One vector, two local bases</text><text x="500" y="77" font-size="19" fill="#536278" text-anchor="middle">Both panels describe the same fibre Eₚ</text><rect x="40" y="100" width="390" height="415" rx="14" fill="#ffffff" stroke="#ced9e6"/><text x="230" y="138" font-size="22" fill="#17233b" text-anchor="middle">Frame e</text><line x1="220" y1="380" x2="350.0" y2="380.0" stroke="#3469aa" stroke-width="3" marker-end="url(#arrow)"/><text x="362.0" y="372.0" font-size="20" fill="#3469aa" text-anchor="start">e₁</text><line x1="220" y1="380" x2="220.0" y2="250.0" stroke="#3469aa" stroke-width="3" marker-end="url(#arrow)"/><text x="232.0" y="242.0" font-size="20" fill="#3469aa" text-anchor="start">e₂</text><line x1="220" y1="380" x2="350" y2="154.83" stroke="#a54d12" stroke-width="4" marker-end="url(#arrow)"/><text x="362" y="145.83339501604596" font-size="20" fill="#a54d12" text-anchor="start">s(p)</text><circle cx="220" cy="380" r="4" fill="#17233b"/><text x="203" y="406" font-size="18" fill="#17233b" text-anchor="start">0</text><text x="230" y="468" font-size="23" fill="#17233b" text-anchor="middle">ψ = (1, √3)ᵀ</text><rect x="540" y="100" width="390" height="415" rx="14" fill="#ffffff" stroke="#ced9e6"/><text x="730" y="138" font-size="22" fill="#17233b" text-anchor="middle">Frame e′ = e R(30°)</text><line x1="720" y1="380" x2="832.58" y2="315.0" stroke="#3469aa" stroke-width="3" marker-end="url(#arrow)"/><text x="844.58" y="307.0" font-size="20" fill="#3469aa" text-anchor="start">e′₁</text><line x1="720" y1="380" x2="655.0" y2="267.42" stroke="#3469aa" stroke-width="3" marker-end="url(#arrow)"/><text x="667.0" y="259.42" font-size="20" fill="#3469aa" text-anchor="start">e′₂</text><line x1="720" y1="380" x2="850" y2="154.83" stroke="#a54d12" stroke-width="4" marker-end="url(#arrow)"/><text x="862" y="145.83339501604596" font-size="20" fill="#a54d12" text-anchor="start">s(p)</text><circle cx="720" cy="380" r="4" fill="#17233b"/><text x="703" y="406" font-size="18" fill="#17233b" text-anchor="start">0</text><text x="730" y="468" font-size="23" fill="#17233b" text-anchor="middle">ψ′ = (√3, 1)ᵀ</text><path d="M786,380 A66,66 0 0 0 777.16,347.00" fill="none" stroke="#7c8798" stroke-width="2"/><text x="800" y="365" font-size="17" fill="#536278" text-anchor="start">30°</text><text x="500" y="560" font-size="22" fill="#17233b" text-anchor="middle">The vector stays fixed. The component column changes.</text></g></svg>