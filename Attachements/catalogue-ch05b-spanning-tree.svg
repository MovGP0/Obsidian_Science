<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="620" viewBox="0 0 1000 620" role="img" aria-labelledby="title desc">
<title id="title">Kruskal minimum spanning tree</title><desc id="desc">Edges AB of weight one, BC of weight two, and CD of weight four are selected. Edge AC of weight three would form a cycle; BD of weight five is unnecessary.</desc>
<rect width="1000" height="620" fill="white"/>
<g font-family="Arial, sans-serif" fill="#17212d" text-anchor="middle">
<text x="500" y="48" font-size="30" font-weight="bold">Connect every vertex without a cycle</text>
<g stroke="#74808b" stroke-width="4" stroke-dasharray="12 9"><path d="M170 160L470 400"/><path d="M470 120L800 330"/></g>
<g stroke="#167445" stroke-width="8"><path d="M170 160L470 120L470 400L800 330" fill="none"/></g>
<g font-size="27" font-weight="bold"><rect x="284" y="100" width="48" height="40" fill="white"/><text x="308" y="130">1</text><rect x="482" y="242" width="45" height="40" fill="white"/><text x="505" y="272">2</text><rect x="267" y="278" width="48" height="40" fill="white"/><text x="291" y="308">3</text><rect x="616" y="370" width="48" height="40" fill="white"/><text x="640" y="400">4</text><rect x="648" y="185" width="48" height="40" fill="white"/><text x="672" y="215">5</text></g>
<g fill="white" stroke="#17212d" stroke-width="3"><circle cx="170" cy="160" r="29"/><circle cx="470" cy="120" r="29"/><circle cx="470" cy="400" r="29"/><circle cx="800" cy="330" r="29"/></g>
<g font-size="27" font-weight="bold"><text x="170" y="170">A</text><text x="470" y="130">B</text><text x="470" y="410">C</text><text x="800" y="340">D</text></g>
<path d="M155 502H240" stroke="#167445" stroke-width="8"/><text x="392" y="511" font-size="24">selected edges</text><path d="M565 502H650" stroke="#74808b" stroke-width="4" stroke-dasharray="12 9"/><text x="793" y="511" font-size="24">unselected edges</text>
<text x="500" y="576" font-size="27">Total selected weight = 1 + 2 + 4 = 7</text>
</g></svg>
