<g font-family="Arial, sans-serif"><text x="550" y="48" text-anchor="middle" fill="#172033" font-size="30" font-weight="bold">Two levels of the four-entry Haar transform</text><rect x="125" y="85" width="110" height="60" rx="10" fill="#eff6ff" stroke="#2457a7" stroke-width="2"/><text x="180" y="125" text-anchor="middle" fill="#172033" font-size="29" font-weight="bold">4</text><rect x="305" y="85" width="110" height="60" rx="10" fill="#eff6ff" stroke="#2457a7" stroke-width="2"/><text x="360" y="125" text-anchor="middle" fill="#172033" font-size="29" font-weight="bold">6</text><rect x="685" y="85" width="110" height="60" rx="10" fill="#eff6ff" stroke="#2457a7" stroke-width="2"/><text x="740" y="125" text-anchor="middle" fill="#172033" font-size="29" font-weight="bold">10</text><rect x="865" y="85" width="110" height="60" rx="10" fill="#eff6ff" stroke="#2457a7" stroke-width="2"/><text x="920" y="125" text-anchor="middle" fill="#172033" font-size="29" font-weight="bold">12</text><line x1="180" y1="145" x2="270" y2="220" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/><line x1="360" y1="145" x2="270" y2="220" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/><line x1="740" y1="145" x2="830" y2="220" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/><line x1="920" y1="145" x2="830" y2="220" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/><rect x="180" y="225" width="180" height="64" rx="10" fill="#eff6ff" stroke="#2457a7" stroke-width="2"/><text x="270" y="266" text-anchor="middle" fill="#172033" font-size="25" font-weight="normal">a₀ = 5√2</text><rect x="740" y="225" width="180" height="64" rx="10" fill="#eff6ff" stroke="#2457a7" stroke-width="2"/><text x="830" y="266" text-anchor="middle" fill="#172033" font-size="25" font-weight="normal">a₁ = 11√2</text><text x="550" y="192" text-anchor="middle" fill="#172033" font-size="24" font-weight="normal">pair sum ÷ √2</text><line x1="270" y1="289" x2="450" y2="380" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/><line x1="830" y1="289" x2="650" y2="380" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/><rect x="355" y="387" width="190" height="70" rx="10" fill="#eff6ff" stroke="#2457a7" stroke-width="2"/><text x="450" y="431" text-anchor="middle" fill="#172033" font-size="28" font-weight="bold">A = 16</text><rect x="555" y="387" width="190" height="70" rx="10" fill="#ffedd5" stroke="#9a3412" stroke-width="2"/><text x="650" y="431" text-anchor="middle" fill="#172033" font-size="28" font-weight="bold">D = −6</text><rect x="55" y="387" width="220" height="70" rx="10" fill="#ffedd5" stroke="#9a3412" stroke-width="2"/><text x="165" y="431" text-anchor="middle" fill="#172033" font-size="27" font-weight="normal">d₀ = −√2</text><rect x="825" y="387" width="220" height="70" rx="10" fill="#ffedd5" stroke="#9a3412" stroke-width="2"/><text x="935" y="431" text-anchor="middle" fill="#172033" font-size="27" font-weight="normal">d₁ = −√2</text><line x1="120" y1="160" x2="120" y2="373" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/><line x1="980" y1="160" x2="980" y2="373" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/><text x="120" y="328" text-anchor="middle" fill="#172033" font-size="23" font-weight="normal">detail</text><text x="980" y="328" text-anchor="middle" fill="#172033" font-size="23" font-weight="normal">detail</text><text x="550" y="510" text-anchor="middle" fill="#172033" font-size="27" font-weight="normal">Keep all four coefficients: (16, −6, −√2, −√2).</text><text x="550" y="553" text-anchor="middle" fill="#172033" font-size="23" font-weight="normal">Reverse the same additions and subtractions to recover (4, 6, 10, 12).</text></g></svg>