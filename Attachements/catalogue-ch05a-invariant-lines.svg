<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="620" viewBox="0 0 1000 620" role="img" aria-labelledby="title desc">
<title id="title">Invariant lines for coordinate swapping</title>
<desc id="desc">The vector (3,1) splits as (2,2) plus (1,-1). Swapping coordinates preserves (2,2), reverses (1,-1), and gives (1,3).</desc>
<defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#243b53"/></marker><marker id="b" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#27639c"/></marker><marker id="c" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#ad501c"/></marker></defs>
<rect width="1000" height="620" fill="white"/>
<g font-family="Arial, sans-serif" fill="#172431" font-size="25">
<text x="500" y="48" text-anchor="middle" font-size="32" font-weight="bold">Swap (x, y) → (y, x)</text>
<g stroke="#afb8c2" stroke-width="2"><path d="M75 470 H590"/><path d="M230 575 V95"/></g>
<path d="M135 565 L585 115" stroke="#5c8d66" stroke-width="3" stroke-dasharray="10 7"/>
<path d="M115 355 L335 575" stroke="#9a7a52" stroke-width="3" stroke-dasharray="10 7"/>
<path d="M230 470 L430 270" stroke="#243b53" stroke-width="4" marker-end="url(#a)"/>
<path d="M230 470 L530 370" stroke="#27639c" stroke-width="4" marker-end="url(#b)"/>
<path d="M230 470 L330 170" stroke="#ad501c" stroke-width="4" marker-end="url(#c)"/>
<path d="M430 270 L530 370" stroke="#27639c" stroke-width="3" marker-end="url(#b)"/>
<path d="M430 270 L330 170" stroke="#ad501c" stroke-width="3" marker-end="url(#c)"/>
<text x="190" y="503">0</text><text x="598" y="479">x</text><text x="220" y="85">y</text>
<text x="544" y="382" fill="#27639c">(3, 1)</text><text x="300" y="143" fill="#ad501c">(1, 3)</text>
<text x="440" y="253">(2, 2)</text>
<text x="280" y="595">Reversed line: x = −y</text>
<text x="650" y="190" font-weight="bold">Fixed component</text>
<text x="650" y="230">(2, 2) → (2, 2)</text>
<text x="650" y="320" font-weight="bold">Reversed component</text>
<text x="650" y="360">(1, −1) → (−1, 1)</text>
<text x="650" y="450" font-weight="bold">Sum after swapping</text>
<text x="650" y="490">(2, 2) + (−1, 1)</text>
<text x="650" y="530">= (1, 3)</text>
<text x="410" y="105" fill="#376a42">Fixed line: x = y</text>
</g></svg>
