<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="655" viewBox="0 0 1000 655" role="img">
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 Z" fill="context-stroke"/></marker></defs>
<rect width="1000" height="655" rx="18" fill="#f8fafc"/>
<g font-family="Segoe UI, Arial, sans-serif"><text x="500" y="43" font-size="28" fill="#17233b" text-anchor="middle">Flat connection on the punctured plane</text><text x="500" y="80" font-size="21" fill="#536278" text-anchor="middle">a = α dθ; da = 0 away from the missing point</text><circle cx="340" cy="340" r="240" fill="#eaf2fb"/><line x1="78" y1="340" x2="321" y2="340" stroke="#8494a6" stroke-width="2" stroke-dasharray="7 6"/><text x="70" y="375" font-size="17" fill="#536278" text-anchor="start">possible angle branch cut</text><circle cx="340" cy="340" r="180" fill="none" stroke="#3469aa" stroke-width="4"/><path d="M520,340 A180,180 0 0 0 467.28,212.72" fill="none" stroke="#3469aa" stroke-width="4" marker-end="url(#arrow)"/><circle cx="340" cy="340" r="13" fill="#f8fafc" stroke="#a54d12" stroke-width="3"/><text x="362" y="347" font-size="19" fill="#a54d12" text-anchor="start">removed point</text><circle cx="520" cy="340" r="5" fill="#3469aa"/><text x="532" y="349" font-size="20" fill="#3469aa" text-anchor="start">p</text><text x="340" y="554" font-size="21" fill="#3469aa" text-anchor="middle">Loop around the hole: H = exp(−2πiα)</text><circle cx="715" cy="238" r="60" fill="none" stroke="#427d43" stroke-width="3"/><path d="M775,238 A60,60 0 0 0 745,186.04" fill="none" stroke="#427d43" stroke-width="3" marker-end="url(#arrow)"/><text x="715" y="335" font-size="20" fill="#427d43" text-anchor="middle">Small loop misses the hole</text><text x="715" y="367" font-size="22" fill="#427d43" text-anchor="middle">∮ a = 0 and H = 1</text><text x="715" y="445" font-size="22" fill="#17233b" text-anchor="middle">For α = 1/2:</text><text x="715" y="481" font-size="21" fill="#3469aa" text-anchor="middle">large-loop holonomy is −1</text><text x="500" y="617" font-size="21" fill="#17233b" text-anchor="middle">Flatness controls local loops. The domain also controls global loops.</text></g></svg>