<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="660" viewBox="0 0 1000 660" role="img" aria-label="One vector, two coordinate descriptions">
<title>One vector, two coordinate descriptions</title><rect width="1000" height="660" fill="white"/>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L8 3 L0 6 Z" fill="#334155"/></marker></defs>
<g font-family="Arial, sans-serif" font-size="24" fill="#172033"><text x="45" y="45" font-size="30" font-weight="bold">One vector, two coordinate descriptions</text><line x1="100" y1="510" x2="535" y2="510" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/><line x1="100" y1="510" x2="100" y2="95" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/><text x="535" y="545" fill="#172033" font-size="24">x</text><text x="65" y="100" fill="#172033" font-size="24">y</text><text x="65" y="550" fill="#172033" font-size="24">O</text><line x1="100" y1="510" x2="325" y2="210" stroke="#1d4ed8" stroke-width="5" marker-end="url(#arrow)"/><line x1="100" y1="510" x2="175" y2="510" stroke="#b45309" stroke-width="5" marker-end="url(#arrow)"/><line x1="100" y1="510" x2="175" y2="360" stroke="#0f766e" stroke-width="5" marker-end="url(#arrow)"/><line x1="175" y1="510" x2="250" y2="360" stroke="#b45309" stroke-width="4" stroke-dasharray="8 5" marker-end="url(#arrow)"/><line x1="250" y1="360" x2="325" y2="210" stroke="#b45309" stroke-width="4" stroke-dasharray="8 5" marker-end="url(#arrow)"/><line x1="325" y1="210" x2="325" y2="510" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6 5"/><line x1="100" y1="210" x2="325" y2="210" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6 5"/><circle cx="325" cy="210" r="6" fill="#1d4ed8"/><text x="140" y="550" fill="#b45309" font-size="24">b₁ = (1, 0)</text><text x="120" y="275" fill="#0f766e" font-size="24">b₂ = (1, 2)</text><text x="335" y="205" fill="#1d4ed8" font-size="24">v = (3, 4)</text><text x="310" y="550" fill="#172033" font-size="24">3</text><text x="65" y="215" fill="#172033" font-size="24">4</text><text x="575" y="190" fill="#172033" font-size="25">In the standard basis:</text><text x="575" y="235" fill="#1d4ed8" font-size="28">v = (3, 4)</text><text x="575" y="320" fill="#172033" font-size="25">In the slanted basis:</text><text x="575" y="365" fill="#b45309" font-size="28">v = 1b₁ + 2b₂</text><text x="575" y="455" fill="#172033" font-size="24">The arrow is unchanged.</text><text x="575" y="495" fill="#172033" font-size="24">Only its coefficients change.</text><text x="100" y="610" fill="#172033" font-size="24">Dashed route: one copy of b₁, then two copies of b₂.</text></g></svg>