<svg xmlns="http://www.w3.org/2000/svg" width="820" height="620" viewBox="0 0 820 620" role="img" aria-labelledby="title desc">
  <title id="title">Two-way clock synchronisation under two propagation assumptions</title>
  <desc id="desc">Two clocks A and B separated by L exchange light. The upper Poincare scheme labels opposite relative speeds c minus v and c plus v in a moving frame. The lower Einstein scheme assigns c in both directions. Both clocks share velocity v.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#34465e"/></marker>
    <g id="clocks">
      <rect x="180" y="90" width="460" height="115" fill="#f7f9fb" stroke="#526780" stroke-width="2"/>
      <circle cx="180" cy="205" r="37" fill="#fff" stroke="#34465e" stroke-width="2.5"/>
      <circle cx="640" cy="205" r="37" fill="#fff" stroke="#34465e" stroke-width="2.5"/>
      <path d="M 180 205 V 180 M 180 205 L 197 192 M 640 205 V 180 M 640 205 L 657 192" fill="none" stroke="#34465e" stroke-width="2.5"/>
      <text x="180" y="75" text-anchor="middle" font-size="25">A</text><text x="640" y="75" text-anchor="middle" font-size="25">B</text><text x="410" y="75" text-anchor="middle" font-size="25">L</text>
      <path d="M 625 123 H 195 M 195 160 H 625 M 360 255 H 460" fill="none" stroke="#34465e" stroke-width="2.5" marker-end="url(#arrow)"/>
      <text x="480" y="263" font-size="25">v</text>
    </g>
  </defs>
  <rect width="820" height="620" rx="16" fill="#fff"/>
  <g font-family="Arial, sans-serif" fill="#172033">
    <text x="410" y="37" text-anchor="middle" font-size="25" font-weight="bold">Poincaré: unequal directional relative speeds</text>
    <use href="#clocks"/>
    <text x="410" y="114" text-anchor="middle" font-size="23">c + v</text><text x="410" y="192" text-anchor="middle" font-size="23">c − v</text>
    <g transform="translate(0 295)">
      <text x="410" y="37" text-anchor="middle" font-size="25" font-weight="bold">Einstein (STR): equal directional relative speeds</text>
      <use href="#clocks"/>
      <text x="410" y="114" text-anchor="middle" font-size="23">c</text><text x="410" y="192" text-anchor="middle" font-size="23">c</text>
    </g>
    <text x="410" y="602" text-anchor="middle" font-size="20">Source first-order synchronisation difference: Δt = Lv/c²</text>
  </g>
</svg>
