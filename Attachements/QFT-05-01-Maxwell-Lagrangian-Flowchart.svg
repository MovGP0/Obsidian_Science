<svg xmlns="http://www.w3.org/2000/svg" width="800" height="230" viewBox="0 0 800 230"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#222" /></marker></defs><rect width="800" height="230" fill="white" /><g stroke="#222" stroke-width="1.5"><rect x="310" y="15" width="180" height="55" rx="7" fill="#e8e5ff" /><rect x="20" y="150" width="200" height="55" rx="7" fill="#e4ffe6" /><rect x="240" y="150" width="325" height="55" rx="7" fill="#fff0df" /><rect x="585" y="150" width="195" height="55" rx="7" fill="#ffe5e5" /><path d="M350 70L120 148" fill="none" marker-end="url(#a)" /><path d="M400 70L400 148" fill="none" marker-end="url(#a)" /><path d="M450 70L682 148" fill="none" marker-end="url(#a)" /></g><g font-family="Georgia,serif" font-size="20" fill="#222" text-anchor="middle"><text x="400" y="49">ℒ = −¼ F<tspan baseline-shift="sub" font-size="13">μν</tspan><tspan baseline-shift="baseline">F</tspan><tspan baseline-shift="super" font-size="13">μν</tspan></text><text x="120" y="184">∂<tspan baseline-shift="sub" font-size="13">μ</tspan><tspan baseline-shift="baseline">F</tspan><tspan baseline-shift="super" font-size="13">μν</tspan><tspan baseline-shift="baseline"> = 0</tspan></text><text x="402" y="184">Gauge invariance: A<tspan baseline-shift="super" font-size="13">μ</tspan><tspan baseline-shift="baseline"> → A</tspan><tspan baseline-shift="super" font-size="13">μ</tspan><tspan baseline-shift="baseline"> + ∂</tspan><tspan baseline-shift="super" font-size="13">μ</tspan><tspan baseline-shift="baseline">α</tspan></text><text x="682" y="184">ℋ = ½(E² + B²)</text><text x="190" y="95" font-size="17">Euler–Lagrange</text><text x="610" y="95" font-size="17">Legendre</text></g></svg>
