<path d="M520 162 V190 H180 V230"/><path d="M520 162 V230"/><path d="M520 162 V190 H860 V230"/>
</g>
<rect x="35" y="240" width="290" height="220" rx="12" fill="#eff8f0" stroke="#256d3d" stroke-width="2"/>
<rect x="375" y="240" width="290" height="220" rx="12" fill="#fff4e5" stroke="#9b5d0b" stroke-width="2"/>
<rect x="715" y="240" width="290" height="220" rx="12" fill="#f5eeff" stroke="#694099" stroke-width="2"/>
<text x="180" y="279" font-size="25" font-weight="bold">Rational function</text>
<text x="180" y="321" font-size="21">Divide polynomials.</text>
<text x="180" y="354" font-size="21">Factor the denominator.</text>
<text x="180" y="387" font-size="21">Use partial fractions.</text>
<text x="180" y="430" font-size="22">1 / (x² + 1) → arctan x</text>
<text x="520" y="279" font-size="25" font-weight="bold">Radicals</text>
<text x="520" y="321" font-size="21">Complete the square.</text>
<text x="520" y="354" font-size="21">Choose a substitution.</text>
<text x="520" y="387" font-size="21">Convert dx as well.</text>
<text x="520" y="430" font-size="22">√x → set x = u²</text>
<text x="860" y="279" font-size="25" font-weight="bold">Other functions</text>
<text x="860" y="321" font-size="21">Look for a derivative pair.</text>
<text x="860" y="354" font-size="21">Try an identity or parts.</text>
<text x="860" y="387" font-size="21">State branch restrictions.</text>
<text x="860" y="430" font-size="22">ln x → integration by parts</text>
