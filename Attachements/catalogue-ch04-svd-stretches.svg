<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="460" viewBox="0 0 1000 460" role="img" aria-label="Singular values as perpendicular stretches">
<rect width="1000" height="460" fill="white"/>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6 Z" fill="context-stroke"/></marker></defs>
<g font-family="Arial, sans-serif" font-size="24" fill="#172033">
<text x="50" y="48" font-size="28">Input unit circle</text><text x="610" y="48" font-size="28">Output ellipse</text>
<path d="M65 255 H385 M225 395 V105 M575 255 H965 M770 395 V105" fill="none" stroke="#9ca3af" stroke-width="2"/>
<circle cx="225" cy="255" r="90" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/>
<ellipse cx="770" cy="255" rx="180" ry="90" fill="#dcfce7" stroke="#15803d" stroke-width="3"/>
<path d="M225 255 H315 M225 255 V165" fill="none" stroke="#1d4ed8" stroke-width="4" marker-end="url(#arrow)"/>
<path d="M770 255 H950 M770 255 V165" fill="none" stroke="#166534" stroke-width="4" marker-end="url(#arrow)"/>
<path d="M405 255 H540" fill="none" stroke="#374151" stroke-width="3" marker-end="url(#arrow)"/>
<text x="407" y="225">Σ = diag(2, 1)</text><text x="275" y="290">1</text><text x="245" y="195">1</text>
<text x="850" y="290">2</text><text x="790" y="210">1</text><text x="95" y="435">Orthogonal coordinate changes preserve lengths; Σ supplies the stretches.</text></g></svg>