<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="890" viewBox="0 0 1100 890" role="img" aria-label="wavelet-location-scale">
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/></marker></defs>
<rect width="1100" height="890" fill="#ffffff"/>
<g font-family="Arial, sans-serif"><text x="550" y="47" text-anchor="middle" fill="#172033" font-size="30" font-weight="bold">Haar wavelets: location, scale, and normalization</text><text x="75" y="87" text-anchor="start" fill="#172033" font-size="25" font-weight="bold">a = 1, b = 0</text><line x1="115" y1="180" x2="995" y2="180" stroke="#64748b" stroke-width="2"/><rect x="150" y="115" width="180.0" height="65" rx="0" fill="#bfdbfe" stroke="#2457a7" stroke-width="2"/><rect x="330.0" y="180" width="180.0" height="65" rx="0" fill="#ffedd5" stroke="#9a3412" stroke-width="2"/><text x="240.0" y="102" text-anchor="middle" fill="#172033" font-size="23" font-weight="normal">+1</text><text x="420.0" y="273" text-anchor="middle" fill="#172033" font-size="23" font-weight="normal">−1</text><text x="150" y="310" text-anchor="middle" fill="#172033" font-size="22" font-weight="normal">b</text><text x="510" y="310" text-anchor="middle" fill="#172033" font-size="22" font-weight="normal">b + a</text><text x="75" y="337" text-anchor="start" fill="#172033" font-size="25" font-weight="bold">a = 1, b = 1/2</text><line x1="115" y1="430" x2="995" y2="430" stroke="#64748b" stroke-width="2"/><rect x="330" y="365" width="180.0" height="65" rx="0" fill="#bfdbfe" stroke="#2457a7" stroke-width="2"/><rect x="510.0" y="430" width="180.0" height="65" rx="0" fill="#ffedd5" stroke="#9a3412" stroke-width="2"/><text x="420.0" y="352" text-anchor="middle" fill="#172033" font-size="23" font-weight="normal">+1</text><text x="600.0" y="523" text-anchor="middle" fill="#172033" font-size="23" font-weight="normal">−1</text><text x="330" y="560" text-anchor="middle" fill="#172033" font-size="22" font-weight="normal">b</text><text x="690" y="560" text-anchor="middle" fill="#172033" font-size="22" font-weight="normal">b + a</text><text x="75" y="587" text-anchor="start" fill="#172033" font-size="25" font-weight="bold">a = 2, b = 0</text><line x1="115" y1="680" x2="995" y2="680" stroke="#64748b" stroke-width="2"/><rect x="150" y="634" width="360.0" height="46" rx="0" fill="#bfdbfe" stroke="#2457a7" stroke-width="2"/><rect x="510.0" y="680" width="360.0" height="46" rx="0" fill="#ffedd5" stroke="#9a3412" stroke-width="2"/><text x="330.0" y="621" text-anchor="middle" fill="#172033" font-size="23" font-weight="normal">+1/√2</text><text x="690.0" y="754" text-anchor="middle" fill="#172033" font-size="23" font-weight="normal">−1/√2</text><text x="150" y="791" text-anchor="middle" fill="#172033" font-size="22" font-weight="normal">b</text><text x="870" y="791" text-anchor="middle" fill="#172033" font-size="22" font-weight="normal">b + a</text><text x="550" y="850" text-anchor="middle" fill="#172033" font-size="25" font-weight="normal">Positive and negative areas cancel. Squared norm stays 1.</text></g></svg>