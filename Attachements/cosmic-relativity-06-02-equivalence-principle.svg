<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="470" viewBox="0 0 1000 470" role="img" aria-labelledby="title desc">
  <title id="title">Local equivalence of gravity and acceleration</title>
  <desc id="desc">Two bodies fall inside a small stationary box on Earth. In an accelerating box in empty space, the floor moves toward two freely floating bodies. Gravity directions outside the small terrestrial box are not parallel.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#28323c"/></marker>
  </defs>
  <rect width="1000" height="470" fill="white"/>
  <g font-family="Arial, sans-serif" fill="#202832" font-size="22">
    <text x="45" y="42" font-weight="bold">(a) Small box in a gravitational field</text>
    <text x="565" y="42" font-weight="bold">(b) Accelerating box in empty space</text>
    <path d="M35 352 Q260 285 485 352 L485 411 Q260 462 35 411Z" fill="#dce4ce" stroke="#778764" stroke-width="2"/>
    <text x="230" y="410">Earth</text>
    <rect x="184" y="97" width="155" height="232" rx="22" fill="none" stroke="#28323c" stroke-width="3"/>
    <circle cx="225" cy="133" r="15" fill="#827b38"/><circle cx="298" cy="133" r="15" fill="#a6adb1"/>
    <circle cx="225" cy="291" r="15" fill="#827b38" opacity="0.4" stroke="#28323c" stroke-dasharray="5 5"/><circle cx="298" cy="291" r="15" fill="#a6adb1" opacity="0.4" stroke="#28323c" stroke-dasharray="5 5"/>
    <path d="M261 163 V256 M77 142 L100 287 M447 142 L425 287" fill="none" stroke="#28323c" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="277" y="215" font-style="italic">g</text>
    <rect x="708" y="85" width="155" height="235" rx="22" fill="none" stroke="#7a8794" stroke-width="2" stroke-dasharray="9 7"/>
    <rect x="708" y="173" width="155" height="235" rx="22" fill="white" fill-opacity="0.8" stroke="#28323c" stroke-width="3"/>
    <circle cx="746" cy="213" r="15" fill="#827b38"/><circle cx="824" cy="213" r="15" fill="#a6adb1"/>
    <path d="M746 268 V366 M824 268 V366 M674 337 V202" fill="none" stroke="#28323c" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="646" y="275" font-style="italic">a</text><text x="737" y="255" font-style="italic">g′ = −a</text>
    <text x="590" y="449" font-size="19">The floor accelerates toward the free bodies.</text>
  </g>
</svg>
