<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600" role="img" aria-labelledby="title desc">
<title id="title">Safe equation transformations</title>
<desc id="desc">Reversible addition keeps x equal to 3. Squaring a square root equation creates the candidates 0 and 3; checking keeps only 3.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#334155"/></marker></defs>
<rect width="1000" height="600" fill="white"/>
<g font-family="Segoe UI,Arial,sans-serif" fill="#172033" font-size="22">

<text x="50" y="50" font-size="28" font-weight="600">Keep the original equation as the final test</text>
<text x="50" y="95" fill="#166534">Reversible transformation: same solution set</text>
<rect x="50" y="120" width="265" height="95" rx="12" fill="#e8f5ed" stroke="#166534" stroke-width="2"/>
<text x="182" y="160" text-anchor="middle">x + 2 = 5</text><text x="182" y="193" text-anchor="middle">solution: 3</text>
<path d="M335 166H638" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
<text x="487" y="148" text-anchor="middle">subtract 2</text><text x="487" y="201" text-anchor="middle">reverse: add 2</text>
<rect x="665" y="120" width="285" height="95" rx="12" fill="#e8f5ed" stroke="#166534" stroke-width="2"/>
<text x="807" y="160" text-anchor="middle">x = 3</text><text x="807" y="193" text-anchor="middle">solution: 3</text>
<text x="50" y="275" fill="#9a3412">Squaring: check each resulting candidate</text>
<rect x="50" y="305" width="265" height="100" rx="12" fill="#fff4e6" stroke="#9a3412" stroke-width="2"/>
<text x="182" y="347" text-anchor="middle">√(x + 1) = x − 1</text><text x="182" y="382" text-anchor="middle">a solution needs x ≥ 1</text>
<path d="M335 355H638" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
<text x="487" y="335" text-anchor="middle">square both sides</text>
<rect x="665" y="305" width="285" height="100" rx="12" fill="#fff4e6" stroke="#9a3412" stroke-width="2"/>
<text x="807" y="347" text-anchor="middle">x(x − 3) = 0</text><text x="807" y="382" text-anchor="middle">candidates: 0 and 3</text>
<path d="M806 415V445" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="50" y="465" width="900" height="90" rx="12" fill="#f1f5f9"/>
<text x="75" y="500" fill="#9a3412">x = 0:  1 ≠ −1 → reject</text>
<text x="535" y="500" fill="#166534">x = 3:  2 = 2 → keep</text>
<text x="75" y="536">The squared equation has an extra root. The original equation has only 3.</text>
</g></svg>
