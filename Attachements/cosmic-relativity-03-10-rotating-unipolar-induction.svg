<svg xmlns="http://www.w3.org/2000/svg" width="1140" height="380" viewBox="0 0 1140 380" role="img" aria-labelledby="title desc">
  <title id="title">Rotational unipolar induction cases</title>
  <desc id="desc">The source's three rotating-disc cases: a moving conductor over a stationary disc produces an emf; rotation of the magnet beneath a stationary conductor produces no emf; rotating both together produces an emf.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#34465e"/></marker>
    <g id="disc">
      <path d="M 55 175 V 250 A 135 35 0 0 0 325 250 V 175 Z" fill="#bec9d5" stroke="#526780" stroke-width="2"/>
      <ellipse cx="190" cy="175" rx="135" ry="35" fill="#e0e5eb" stroke="#526780" stroke-width="2"/>
      <line x1="190" y1="175" x2="275" y2="120" stroke="#222" stroke-width="4"/>
      <text x="110" y="170" font-size="23">N</text>
    </g>
  </defs>
  <rect width="1140" height="380" rx="16" fill="#fff"/>
  <g font-family="Arial, sans-serif" fill="#172033">
    <g>
      <use href="#disc"/>
      <text x="190" y="45" text-anchor="middle" font-size="24">v_C ≠ 0, E ≠ 0</text>
      <path d="M 255 98 Q 300 95 320 125" fill="none" stroke="#34465e" stroke-width="3" marker-end="url(#arrow)"/>
      <text x="190" y="340" text-anchor="middle" font-size="21">a — Conductor rotates</text>
    </g>
    <g transform="translate(380 0)">
      <use href="#disc"/>
      <text x="190" y="45" text-anchor="middle" font-size="24">v_M ≠ 0, v_C = 0, E = 0</text>
      <path d="M 220 295 Q 180 310 145 290" fill="none" stroke="#34465e" stroke-width="3" marker-end="url(#arrow)"/>
      <text x="190" y="340" text-anchor="middle" font-size="21">b — Magnet rotates</text>
    </g>
    <g transform="translate(760 0)">
      <use href="#disc"/>
      <text x="190" y="45" text-anchor="middle" font-size="24">v_C = v_M ≠ 0, E ≠ 0</text>
      <path d="M 255 98 Q 300 95 320 125 M 220 295 Q 180 310 145 290" fill="none" stroke="#34465e" stroke-width="3" marker-end="url(#arrow)"/>
      <text x="190" y="340" text-anchor="middle" font-size="21">c — Both rotate together</text>
    </g>
  </g>
</svg>
