    <path d="M324 166 L483.2 254.2"/>
    <path d="M324 166 L440.3 304.7"/>
  </g>
  <circle cx="324" cy="166" r="24" fill="none" stroke="#64748b" stroke-width="1.3" stroke-dasharray="4 4"/>
