<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="650" viewBox="0 0 1000 650"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="context-stroke"/></marker></defs><rect width="1000" height="650" fill="#ffffff"/><g font-family="Arial, sans-serif" fill="#172033" font-size="22"><text x="45" y="45" font-size="28" fill="#172033" text-anchor="start">Gradient and level sets: f(x, y) = x² + y²</text><line x1="70.00" y1="355.00" x2="675.00" y2="355.00" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><line x1="355.00" y1="620.00" x2="355.00" y2="85.00" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><text x="680" y="350" font-size="22" fill="#172033" text-anchor="start">x</text><text x="365" y="92" font-size="22" fill="#172033" text-anchor="start">y</text><circle cx="355" cy="355" r="90" fill="none" stroke="#93b9db" stroke-width="2"/><text x="385" y="433" font-size="20" fill="#35658e" text-anchor="start">f = 1</text><circle cx="355" cy="355" r="127.27922061357856" fill="none" stroke="#93b9db" stroke-width="2"/><text x="385" y="470.27922061357856" font-size="20" fill="#35658e" text-anchor="start">f = 2</text><circle cx="355" cy="355" r="201.24611797498108" fill="none" stroke="#93b9db" stroke-width="2"/><text x="385" y="544.2461179749811" font-size="20" fill="#35658e" text-anchor="start">f = 5</text><line x1="330.00" y1="150.00" x2="560.00" y2="380.00" stroke="#a85516" stroke-width="3"/><line x1="445.00" y1="265.00" x2="575.00" y2="135.00" stroke="#196a4f" stroke-width="4" marker-end="url(#arrow)"/><line x1="445.00" y1="265.00" x2="555.00" y2="265.00" stroke="#7c3aed" stroke-width="4" marker-end="url(#arrow)"/><circle cx="445" cy="265" r="6" fill="#172033"/><text x="418" y="300" font-size="21" fill="#172033" text-anchor="start">p = (1, 1)</text><text x="597" y="140" font-size="22" fill="#196a4f" text-anchor="start">∇f(p) = (2, 2)</text><text x="515" y="249" font-size="21" fill="#7c3aed" text-anchor="start">u = (1, 0)</text><text x="515" y="395" font-size="22" fill="#a85516" text-anchor="start">tangent: x + y = 2</text><text x="705" y="455" font-size="24" fill="#172033" text-anchor="start">At p:</text><text x="705" y="492" font-size="21" fill="#172033" text-anchor="start">df(v) = (2, 2) · v</text><text x="705" y="529" font-size="21" fill="#172033" text-anchor="start">Dᵤ f = 2</text><text x="705" y="566" font-size="21" fill="#172033" text-anchor="start">greatest rate = 2√2</text><text x="45" y="625" font-size="22" fill="#172033" text-anchor="start">The gradient is normal to the regular level curve through p.</text></g></svg>