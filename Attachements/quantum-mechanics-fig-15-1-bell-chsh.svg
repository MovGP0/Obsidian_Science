<svg xmlns="http://www.w3.org/2000/svg" width="720" height="176" viewBox="0 0 720 176" role="img" aria-labelledby="title desc">
  <title id="title">Bell–CHSH experiment</title>
  <desc id="desc">A central EPR source sends one particle to Alice and one to Bob. Each detector has two choices of measurement axis and returns plus or minus one.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#334155"/>
    </marker>
  </defs>
  <g stroke="#334155" stroke-width="2">
    <rect x="108" y="58" width="88" height="52" rx="7" fill="#e0f2fe"/>
    <rect x="524" y="58" width="88" height="52" rx="7" fill="#e0f2fe"/>
    <circle cx="360" cy="84" r="32" fill="#f8fafc"/>
    <g fill="none" marker-end="url(#arrow)">
      <path d="M328 84H197"/>
      <path d="M392 84H523"/>
      <path d="M152 144V111"/>
      <path d="M568 144V111"/>
      <path d="M108 84H74"/>
      <path d="M612 84H646"/>
    </g>
  </g>
  <g fill="#0f172a" font-family="system-ui, sans-serif" font-size="17" text-anchor="middle">
    <text x="152" y="90">Alice</text>
    <text x="568" y="90">Bob</text>
    <text x="360" y="90">EPR</text>
    <text x="360" y="140">Source</text>
    <text x="152" y="166">a or a′</text>
    <text x="568" y="166">b or b′</text>
    <text x="42" y="90">A = ±1</text>
    <text x="679" y="90">B = ±1</text>
    <text x="263" y="67">|Ψ⁻⟩</text>
    <text x="457" y="67">|Ψ⁻⟩</text>
  </g>
</svg>
