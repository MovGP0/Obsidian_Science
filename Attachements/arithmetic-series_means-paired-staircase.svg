<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600" role="img" aria-labelledby="title">
<title id="title">Two arithmetic staircases form a rectangle</title>
<rect width="1000" height="600" fill="white"/>
<g font-family="Arial, sans-serif" fill="#172534">
<text x="500" y="46" text-anchor="middle" font-size="28" font-weight="bold">Pair two copies of 1 + 2 + 3 + 4 + 5</text>
<text x="500" y="87" text-anchor="middle" font-size="22">Each column totals 6 squares</text>
<rect x="280" y="125" width="62" height="62" fill="#ffe0af" stroke="#33475b" stroke-width="1.6"/>
<rect x="280" y="187" width="62" height="62" fill="#ffe0af" stroke="#33475b" stroke-width="1.6"/>
<rect x="280" y="249" width="62" height="62" fill="#ffe0af" stroke="#33475b" stroke-width="1.6"/>
<rect x="280" y="311" width="62" height="62" fill="#ffe0af" stroke="#33475b" stroke-width="1.6"/>
<rect x="280" y="373" width="62" height="62" fill="#ffe0af" stroke="#33475b" stroke-width="1.6"/>
<rect x="280" y="435" width="62" height="62" fill="#d9eafd" stroke="#33475b" stroke-width="1.6"/>
<text x="311.0" y="532" text-anchor="middle" font-size="22">1 + 5</text>
<rect x="342" y="125" width="62" height="62" fill="#ffe0af" stroke="#33475b" stroke-width="1.6"/>
<rect x="342" y="187" width="62" height="62" fill="#ffe0af" stroke="#33475b" stroke-width="1.6"/>
<rect x="342" y="249" width="62" height="62" fill="#ffe0af" stroke="#33475b" stroke-width="1.6"/>
<rect x="342" y="311" width="62" height="62" fill="#ffe0af" stroke="#33475b" stroke-width="1.6"/>
<rect x="342" y="373" width="62" height="62" fill="#d9eafd" stroke="#33475b" stroke-width="1.6"/>
<rect x="342" y="435" width="62" height="62" fill="#d9eafd" stroke="#33475b" stroke-width="1.6"/>
<text x="373.0" y="532" text-anchor="middle" font-size="22">2 + 4</text>
<rect x="404" y="125" width="62" height="62" fill="#ffe0af" stroke="#33475b" stroke-width="1.6"/>
<rect x="404" y="187" width="62" height="62" fill="#ffe0af" stroke="#33475b" stroke-width="1.6"/>
<rect x="404" y="249" width="62" height="62" fill="#ffe0af" stroke="#33475b" stroke-width="1.6"/>
<rect x="404" y="311" width="62" height="62" fill="#d9eafd" stroke="#33475b" stroke-width="1.6"/>
<rect x="404" y="373" width="62" height="62" fill="#d9eafd" stroke="#33475b" stroke-width="1.6"/>
<rect x="404" y="435" width="62" height="62" fill="#d9eafd" stroke="#33475b" stroke-width="1.6"/>
<text x="435.0" y="532" text-anchor="middle" font-size="22">3 + 3</text>
<rect x="466" y="125" width="62" height="62" fill="#ffe0af" stroke="#33475b" stroke-width="1.6"/>
<rect x="466" y="187" width="62" height="62" fill="#ffe0af" stroke="#33475b" stroke-width="1.6"/>
<rect x="466" y="249" width="62" height="62" fill="#d9eafd" stroke="#33475b" stroke-width="1.6"/>
<rect x="466" y="311" width="62" height="62" fill="#d9eafd" stroke="#33475b" stroke-width="1.6"/>
<rect x="466" y="373" width="62" height="62" fill="#d9eafd" stroke="#33475b" stroke-width="1.6"/>
<rect x="466" y="435" width="62" height="62" fill="#d9eafd" stroke="#33475b" stroke-width="1.6"/>
<text x="497.0" y="532" text-anchor="middle" font-size="22">4 + 2</text>
<rect x="528" y="125" width="62" height="62" fill="#ffe0af" stroke="#33475b" stroke-width="1.6"/>
<rect x="528" y="187" width="62" height="62" fill="#d9eafd" stroke="#33475b" stroke-width="1.6"/>
<rect x="528" y="249" width="62" height="62" fill="#d9eafd" stroke="#33475b" stroke-width="1.6"/>
<rect x="528" y="311" width="62" height="62" fill="#d9eafd" stroke="#33475b" stroke-width="1.6"/>
<rect x="528" y="373" width="62" height="62" fill="#d9eafd" stroke="#33475b" stroke-width="1.6"/>
<rect x="528" y="435" width="62" height="62" fill="#d9eafd" stroke="#33475b" stroke-width="1.6"/>
<text x="559.0" y="532" text-anchor="middle" font-size="22">5 + 1</text>
<rect x="65" y="220" width="28" height="28" fill="#d9eafd" stroke="#33475b"/>
<text x="105" y="242" font-size="22">First copy</text>
<rect x="65" y="275" width="28" height="28" fill="#ffe0af" stroke="#33475b"/>
<text x="105" y="297" font-size="22">Second copy</text>
<text x="655" y="250" font-size="24">2S = 5 × 6 = 30</text>
<text x="655" y="300" font-size="24">S = 30 ÷ 2 = 15</text>
<text x="500" y="576" text-anchor="middle" font-size="23">Pairing works for any number of equally spaced terms.</text>
</g>
</svg>