<line x1="305.00" y1="130.00" x2="305.00" y2="490.00" stroke="#dce3ed" stroke-width="1" />
<text x="300" y="515" class="small muted" >2</text>
<line x1="410.00" y1="130.00" x2="410.00" y2="490.00" stroke="#dce3ed" stroke-width="1" />
<text x="405" y="515" class="small muted" >3</text>
<line x1="515.00" y1="130.00" x2="515.00" y2="490.00" stroke="#dce3ed" stroke-width="1" />
<text x="510" y="515" class="small muted" >4</text>
<line x1="65.00" y1="470.00" x2="550.00" y2="470.00" stroke="#dce3ed" stroke-width="1" />
<line x1="65.00" y1="365.00" x2="550.00" y2="365.00" stroke="#dce3ed" stroke-width="1" />
<text x="66" y="371" class="small muted" >1</text>
<line x1="65.00" y1="260.00" x2="550.00" y2="260.00" stroke="#dce3ed" stroke-width="1" />
<text x="66" y="266" class="small muted" >2</text>
<line x1="65.00" y1="155.00" x2="550.00" y2="155.00" stroke="#dce3ed" stroke-width="1" />
<text x="66" y="161" class="small muted" >3</text>
<line x1="65.00" y1="470.00" x2="560.00" y2="470.00" stroke="#6e7b8b" stroke-width="2" marker-end="url(#axis)"/>
<line x1="95.00" y1="490.00" x2="95.00" y2="120.00" stroke="#6e7b8b" stroke-width="2" marker-end="url(#axis)"/>
<text x="566" y="475" class="" >x</text>
<text x="89" y="111" class="" >y</text>
<text x="75" y="493" class="small muted" >0</text>
<polygon points="95,470 305,470 410,260 200,260" fill="#18785e" fill-opacity="0.08"/>
<line x1="305.00" y1="470.00" x2="410.00" y2="260.00" stroke="#af3d4b" stroke-width="2" stroke-dasharray="7 6"/>
<line x1="200.00" y1="260.00" x2="410.00" y2="260.00" stroke="#2264a8" stroke-width="2" stroke-dasharray="7 6"/>
