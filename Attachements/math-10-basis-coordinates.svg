<circle cx="410" cy="260" r="5" fill="#18785e"/>
<text x="425" y="248" class="green" >w = (3, 2)</text>
<text x="356" y="369" class="red" >+ v</text>
<text x="278" y="245" class="blue" >+ u</text>
<rect x="610" y="149" width="340" height="332" rx="15" fill="white" stroke="#dce3ed"/>
<text x="637" y="187" class="muted" >Standard coordinates</text>
<text x="637" y="225" class="title" >w = 3e₁ + 2e₂</text>
<text x="637" y="272" class="muted" >Coordinates in B</text>
<text x="637" y="310" class="title" >[w]B = (1, 1)</text>
<text x="637" y="361" class="" >Both describe the same vector.</text>
<text x="637" y="405" class="small" >det[u  v] = 4 ≠ 0</text>
<text x="637" y="434" class="small muted" >The basis vectors are independent.</text>
<text x="42" y="558" class="muted" >The dashed edges complete the parallelogram for vector addition.</text>
