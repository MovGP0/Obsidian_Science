<line x1="95.00" y1="470.00" x2="410.00" y2="260.00" stroke="#18785e" stroke-width="4" marker-end="url(#green)"/>
<text x="224" y="459" class="blue" >u</text>
<text x="118" y="335" class="red" >v</text>
