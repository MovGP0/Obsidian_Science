<marker id="blue" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#2264a8"/></marker>
<marker id="red" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#af3d4b"/></marker>
<marker id="green" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#18785e"/></marker>
</defs>
<rect width="1000" height="590" rx="18" fill="#f7f9fc"/>
<text x="42" y="47" class="title" >One vector, two coordinate descriptions</text>
<text x="42" y="78" class="muted" >Basis B = (u, v), with u = (2, 0) and v = (1, 2)</text>
<line x1="95.00" y1="130.00" x2="95.00" y2="490.00" stroke="#dce3ed" stroke-width="1" />
<line x1="200.00" y1="130.00" x2="200.00" y2="490.00" stroke="#dce3ed" stroke-width="1" />
