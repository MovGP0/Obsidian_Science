<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="620" viewBox="0 0 1040 620" role="img" aria-labelledby="title desc">
<title id="title">A straight geodesic in polar coordinates</title><desc id="desc">The line y equals b passes above the origin. Its tangent is horizontal, while radius and polar angle change along the line.</desc>
<defs>
<marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#2563eb"/></marker>
<marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#15803d"/></marker>
<marker id="black" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#172033"/></marker>
<marker id="grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#64748b"/></marker>
</defs>
<rect width="1040" height="620" rx="16" fill="#fff"/>
<g font-family="Segoe UI, Arial, sans-serif">
<text x="38.00" y="46.00" font-size="28" fill="#172033" text-anchor="start" font-weight="bold">A straight geodesic in polar coordinates</text>
<defs><clipPath id="plotClip"><rect x="45" y="120" width="525" height="440"/></clipPath></defs>
<text x="38.00" y="80.00" font-size="22" fill="#475569" text-anchor="start" font-weight="normal">x(t) = t,  y(t) = b &gt; 0</text>
<line x1="55.00" y1="465.00" x2="555.00" y2="465.00" stroke="#64748b" stroke-width="2" marker-end="url(#grey)"/>
<line x1="270.00" y1="550.00" x2="270.00" y2="125.00" stroke="#64748b" stroke-width="2" marker-end="url(#grey)"/>
<text x="560.00" y="472.00" font-size="20" fill="#172033" text-anchor="start" font-weight="normal">x</text>
<text x="282.00" y="128.00" font-size="20" fill="#172033" text-anchor="start" font-weight="normal">y</text>
<text x="245.00" y="492.00" font-size="20" fill="#172033" text-anchor="start" font-weight="normal">O</text>
<circle cx="270" cy="465" r="100" fill="none" stroke="#e2e8f0" stroke-width="1.5" clip-path="url(#plotClip)"/>
<circle cx="270" cy="465" r="200" fill="none" stroke="#e2e8f0" stroke-width="1.5" clip-path="url(#plotClip)"/>
<circle cx="270" cy="465" r="300" fill="none" stroke="#e2e8f0" stroke-width="1.5" clip-path="url(#plotClip)"/>
<line x1="70.00" y1="305.00" x2="535.00" y2="305.00" stroke="#172033" stroke-width="3" marker-end="url(#black)"/>
<text x="63.00" y="290.00" font-size="21" fill="#172033" text-anchor="start" font-weight="normal">y = b</text>
<text x="507.00" y="291.00" font-size="18" fill="#172033" text-anchor="start" font-weight="normal">t increases</text>
<line x1="270.00" y1="465.00" x2="440.00" y2="305.00" stroke="#2563eb" stroke-width="3"/>
<line x1="440.00" y1="305.00" x2="440.00" y2="465.00" stroke="#94a3b8" stroke-width="2" stroke-dasharray="5 5"/>
<circle cx="440.0" cy="305.0" r="5" fill="#172033"/>
<text x="449.00" y="334.00" font-size="20" fill="#172033" text-anchor="start" font-weight="normal">(t, b)</text>
<text x="331.00" y="373.00" font-size="22" fill="#2563eb" text-anchor="start" font-weight="normal">r(t)</text>
<path d="M 328 465 A 58 58 0 0 0 312.24 425.25" fill="none" stroke="#15803d" stroke-width="2.5"/>
<text x="345.00" y="440.00" font-size="22" fill="#15803d" text-anchor="start" font-weight="normal">θ(t)</text>
<text x="432.00" y="493.00" font-size="20" fill="#172033" text-anchor="start" font-weight="normal">t</text>
<text x="281.00" y="291.00" font-size="20" fill="#172033" text-anchor="start" font-weight="normal">b</text>
<rect x="605" y="125" width="395" height="420" rx="16" fill="#f1f5f9"/>
<text x="630.00" y="166.00" font-size="23" fill="#172033" text-anchor="start" font-weight="bold">Polar coordinate changes</text>
<text x="630.00" y="213.00" font-size="23" fill="#2563eb" text-anchor="start" font-weight="normal">r = √(t² + b²)</text>
<text x="630.00" y="257.00" font-size="22" fill="#2563eb" text-anchor="start" font-weight="normal">r′ = t/r,   r″ = b²/r³</text>
<text x="630.00" y="301.00" font-size="22" fill="#15803d" text-anchor="start" font-weight="normal">θ′ = −b/r²</text>
<text x="630.00" y="344.00" font-size="22" fill="#15803d" text-anchor="start" font-weight="normal">θ″ = 2bt/r⁴</text>
<text x="630.00" y="400.00" font-size="23" fill="#172033" text-anchor="start" font-weight="bold">Geodesic equations</text>
<text x="630.00" y="446.00" font-size="23" fill="#172033" text-anchor="start" font-weight="normal">r″ − r(θ′)² = 0</text>
<text x="630.00" y="490.00" font-size="23" fill="#172033" text-anchor="start" font-weight="normal">θ″ + 2r′θ′/r = 0</text>
<text x="38.00" y="589.00" font-size="20" fill="#475569" text-anchor="start" font-weight="normal">The nonzero polar second derivatives cancel the connection terms.</text>
</g></svg>