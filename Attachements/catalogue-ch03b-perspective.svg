<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="660" viewBox="0 0 1000 660" role="img" aria-label="Perspective: image height depends on depth">
<title>Perspective: image height depends on depth</title><rect width="1000" height="660" fill="white"/>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L8 3 L0 6 Z" fill="#334155"/></marker></defs>
<g font-family="Arial, sans-serif" font-size="24" fill="#172033"><text x="45" y="45" font-size="30" font-weight="bold">Perspective: image height depends on depth</text><line x1="100" y1="450" x2="950" y2="450" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/><text x="850" y="490" fill="#172033" font-size="24">depth z</text><line x1="300" y1="130" x2="300" y2="480" stroke="#334155" stroke-width="4"/><text x="205" y="105" fill="#172033" font-size="24">image plane z = 2</text><line x1="100" y1="450" x2="500" y2="290" stroke="#1d4ed8" stroke-width="4"/><line x1="100" y1="450" x2="900" y2="290" stroke="#b45309" stroke-width="4"/><line x1="500" y1="290" x2="500" y2="450" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6 5"/><line x1="900" y1="290" x2="900" y2="450" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6 5"/><circle cx="100" cy="450" r="6" fill="#334155"/><text x="70" y="490" fill="#172033" font-size="24">O</text><circle cx="500" cy="290" r="6" fill="#1d4ed8"/><text x="440" y="250" fill="#1d4ed8" font-size="24">P: z = 4, y = 1</text><circle cx="900" cy="290" r="6" fill="#b45309"/><text x="745" y="250" fill="#b45309" font-size="24">Q: z = 8, y = 1</text><circle cx="300" cy="370" r="6" fill="#1d4ed8"/><circle cx="300" cy="410" r="6" fill="#b45309"/><text x="330" y="320" fill="#1d4ed8" font-size="24">y′ = 1/2</text><text x="330" y="445" fill="#b45309" font-size="24">y′ = 1/4</text><text x="90" y="555" fill="#172033" font-size="28">Ray intersection: y′ = 2y / z</text><text x="90" y="605" fill="#172033" font-size="24">Same height in space; different height on the image plane.</text></g></svg>