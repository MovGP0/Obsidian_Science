<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="680" viewBox="0 0 1000 680" role="img" aria-label="A cylinder geodesic becomes a straight line">
<title>A cylinder geodesic becomes a straight line</title><rect width="1000" height="680" fill="white"/>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L8 3 L0 6 Z" fill="#334155"/></marker></defs>
<g font-family="Arial, sans-serif" font-size="24" fill="#172033"><text x="45" y="45" font-size="30" font-weight="bold">A cylinder geodesic becomes a straight line</text><rect x="100" y="110" width="550" height="410" fill="#f1f5f9" stroke="#334155" stroke-width="3"/><line x1="237.5" y1="110" x2="237.5" y2="520" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="6 5"/><line x1="375.0" y1="110" x2="375.0" y2="520" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="6 5"/><line x1="512.5" y1="110" x2="512.5" y2="520" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="6 5"/><line x1="100" y1="520" x2="375" y2="110" stroke="#1d4ed8" stroke-width="5"/><circle cx="100" cy="520" r="6" fill="#1d4ed8"/><circle cx="375" cy="110" r="6" fill="#1d4ed8"/><line x1="78" y1="480" x2="78" y2="165" stroke="#0f766e" stroke-width="3" marker-end="url(#arrow)"/><line x1="672" y1="480" x2="672" y2="165" stroke="#0f766e" stroke-width="3" marker-end="url(#arrow)"/><text x="83" y="565" fill="#172033" font-size="24">U = 0</text><text x="545" y="565" fill="#172033" font-size="24">U = 4π</text><text x="15" y="100" fill="#172033" font-size="24">v = 3π</text><text x="35" y="525" fill="#172033" font-size="24">0</text><text x="710" y="170" fill="#172033" font-size="25">Radius R = 2</text><text x="710" y="230" fill="#172033" font-size="24">U = Ru = 2t</text><text x="710" y="275" fill="#172033" font-size="24">v = 3t</text><text x="710" y="345" fill="#172033" font-size="24">0 ≤ t ≤ π</text><text x="710" y="410" fill="#0f766e" font-size="22">Edge arrows match.</text><text x="710" y="450" fill="#172033" font-size="22">Join them to wrap</text><text x="710" y="480" fill="#172033" font-size="22">the rectangle.</text><text x="95" y="625" fill="#172033" font-size="24">Local length rule: ds² = dU² + dv².  Blue segment length: π√13.</text></g></svg>