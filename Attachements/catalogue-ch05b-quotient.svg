<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="620" viewBox="0 0 1000 620" role="img" aria-labelledby="title desc">
<title id="title">Integers grouped by their remainders modulo four</title><desc id="desc">Four columns contain integers in each remainder class. Two calculation routes show that three plus two has remainder one.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#24538b"/></marker></defs>
<rect width="1000" height="620" fill="white"/>
<g font-family="Arial, sans-serif" fill="#17212d" text-anchor="middle">
<text x="500" y="48" font-size="30" font-weight="bold">A quotient groups equivalent inputs</text>
<g font-size="25">
<rect x="40" y="86" width="210" height="230" rx="14" fill="#e7f0fa" stroke="#24538b" stroke-width="2"/><text x="145" y="129" font-weight="bold">Class [0]</text><text x="145" y="183">…, −4, 0, 4, …</text><text x="145" y="272">remainder 0</text>
<rect x="277" y="86" width="210" height="230" rx="14" fill="#e7f0fa" stroke="#24538b" stroke-width="2"/><text x="382" y="129" font-weight="bold">Class [1]</text><text x="382" y="183">…, −3, 1, 5, …</text><text x="382" y="272">remainder 1</text>
<rect x="514" y="86" width="210" height="230" rx="14" fill="#e7f0fa" stroke="#24538b" stroke-width="2"/><text x="619" y="129" font-weight="bold">Class [2]</text><text x="619" y="183">…, −2, 2, 6, …</text><text x="619" y="272">remainder 2</text>
<rect x="751" y="86" width="210" height="230" rx="14" fill="#e7f0fa" stroke="#24538b" stroke-width="2"/><text x="856" y="129" font-weight="bold">Class [3]</text><text x="856" y="183">…, −1, 3, 7, …</text><text x="856" y="272">remainder 3</text>
</g>
<g font-size="27"><text x="205" y="400">3 + 2</text><text x="795" y="400">5</text><text x="205" y="545">[3] + [2]</text><text x="795" y="545">[1]</text></g>
<g stroke="#24538b" stroke-width="3" marker-end="url(#arrow)"><path d="M300 390H710"/><path d="M205 422V495"/><path d="M795 422V495"/><path d="M330 535H710"/></g>
<g font-size="22"><text x="500" y="375">add integers</text><text x="500" y="575">add remainder classes</text><text x="108" y="468">group</text><text x="890" y="468">group</text></g>
</g></svg>
