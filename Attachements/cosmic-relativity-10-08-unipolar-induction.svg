<svg xmlns="http://www.w3.org/2000/svg" width="1110" height="420" viewBox="0 0 1110 420" role="img" aria-labelledby="title desc">
  <title id="title">Two mechanisms proposed for unipolar induction</title>
  <desc id="desc">Three explanatory panels show microscopic magnet currents adding to a boundary current, force on a moving electron, and electric charge separation when the magnet moves.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#263238"/></marker>
    <g id="loop" fill="none" stroke="#546e7a" stroke-width="2"><circle r="23"/><path d="M-17 -16 Q0 -32 17 -16" marker-end="url(#arrow)"/></g>
    <g id="magnet"><rect x="15" y="90" width="320" height="230" rx="24" fill="#eceff1" stroke="#263238" stroke-width="3"/><path d="M45 103 H300 M321 120 V290 M300 307 H45 M29 290 V120" fill="none" stroke="#263238" stroke-width="3" marker-end="url(#arrow)"/></g>
  </defs>
  <rect width="1110" height="420" fill="white"/>
  <g font-family="Arial, sans-serif" font-size="20" fill="#18242b">
    <g transform="translate(10 0)">
      <text x="15" y="36" font-weight="bold">a  Equivalent boundary current</text>
      <use href="#magnet"/>
      <g><use href="#loop" x="64" y="143"/><use href="#loop" x="135" y="143"/><use href="#loop" x="206" y="143"/><use href="#loop" x="277" y="143"/><use href="#loop" x="64" y="205"/><use href="#loop" x="135" y="205"/><use href="#loop" x="206" y="205"/><use href="#loop" x="277" y="205"/><use href="#loop" x="64" y="267"/><use href="#loop" x="135" y="267"/><use href="#loop" x="206" y="267"/><use href="#loop" x="277" y="267"/></g>
      <text x="175" y="359" text-anchor="middle">Microscopic circulating currents</text>
      <text x="175" y="386" text-anchor="middle">sum to a surface current.</text>
    </g>
    <g transform="translate(380 0)">
      <text x="15" y="36" font-weight="bold">b  Conductor moves</text>
      <use href="#magnet"/>
      <text x="68" y="153">attraction</text><text x="68" y="282">repulsion</text>
      <circle cx="140" cy="206" r="12" fill="white" stroke="#263238" stroke-width="2"/><text x="140" y="213" text-anchor="middle">−</text>
      <path d="M154 206 H218" fill="none" stroke="#263238" stroke-width="3" marker-end="url(#arrow)"/><text x="193" y="235">v</text>
      <path d="M140 190 V160" fill="none" stroke="#263238" stroke-width="3" marker-end="url(#arrow)"/>
      <path d="M154 200 Q216 196 242 157" fill="none" stroke="#546e7a" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
      <text x="175" y="359" text-anchor="middle">Current–current interaction</text>
      <text x="175" y="386" text-anchor="middle">deflects the moving charge.</text>
    </g>
    <g transform="translate(750 0)">
      <text x="15" y="36" font-weight="bold">c  Magnet moves</text>
      <rect x="60" y="90" width="290" height="230" rx="24" fill="none" stroke="#607d8b" stroke-width="2" stroke-dasharray="7 5"/>
      <use href="#magnet"/>
      <path d="M227 67 H133" fill="none" stroke="#263238" stroke-width="3" marker-end="url(#arrow)"/><text x="174" y="54" text-anchor="middle">−v</text>
      <text x="48" y="137" font-size="28">+   +   +   +   +   +</text>
      <text x="48" y="293" font-size="28">−   −   −   −   −   −</text>
      <circle cx="140" cy="213" r="12" fill="white" stroke="#263238" stroke-width="2"/><text x="140" y="220" text-anchor="middle">−</text>
      <path d="M140 197 V163" fill="none" stroke="#263238" stroke-width="3" marker-end="url(#arrow)"/>
      <text x="175" y="359" text-anchor="middle">Unequal charge densities</text>
      <text x="175" y="386" text-anchor="middle">produce an electric field.</text>
    </g>
  </g>
</svg>
