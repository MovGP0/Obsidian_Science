<svg xmlns="http://www.w3.org/2000/svg" width="860" height="300" viewBox="0 0 860 300">
  <title>Spin configurations for neutrino and antineutrino electron scattering</title>
  <desc>Panel a shows initial momentum and spin directions: Jz zero for neutrino scattering and Jz one for antineutrino scattering. Panel b shows the backward final states: Jz zero and Jz minus one.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 0 L 10 5 L 0 10 L 3 5 Z" fill="#222"/></marker></defs>
  <rect width="860" height="300" fill="white"/>
  <g fill="none" stroke="#222" stroke-width="1.5" marker-end="url(#arrow)">
    <path d="M 80 35 V 145"/><path d="M 80 255 V 150"/>
    <path d="M 270 35 V 145"/><path d="M 270 255 V 150"/>
    <path d="M 500 145 V 35"/><path d="M 500 150 V 255"/>
    <path d="M 690 145 V 35"/><path d="M 690 150 V 255"/>
  </g>
  <g font-family="Arial, sans-serif" font-size="23" fill="#222">
    <text x="56" y="44">e</text><text x="56" y="258">ν</text>
    <text x="246" y="44">e</text><text x="246" y="258">ν̅</text>
    <text x="476" y="44">e</text><text x="476" y="258">ν</text>
    <text x="666" y="44">e</text><text x="666" y="258">ν̅</text>
    <text x="90" y="104">⇑</text><text x="90" y="215">⇓</text>
    <text x="280" y="104">⇑</text><text x="280" y="215">⇑</text>
    <text x="510" y="104">⇓</text><text x="510" y="215">⇑</text>
    <text x="700" y="104">⇓</text><text x="700" y="215">⇓</text>
    <text x="113" y="157">J<tspan baseline-shift="sub" font-size="16">z</tspan> = 0</text>
    <text x="303" y="157">J<tspan baseline-shift="sub" font-size="16">z</tspan> = 1</text>
    <text x="533" y="157">J<tspan baseline-shift="sub" font-size="16">z</tspan> = 0</text>
    <text x="723" y="157">J<tspan baseline-shift="sub" font-size="16">z</tspan> = −1</text>
    <text x="197" y="291">(a)</text><text x="617" y="291">(b)</text>
  </g>
</svg>
