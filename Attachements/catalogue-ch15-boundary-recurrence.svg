<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="525" viewBox="0 0 1100 525" role="img" aria-label="boundary-recurrence">
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/></marker></defs>
<rect width="1100" height="525" fill="#ffffff"/>
<g font-family="Arial, sans-serif"><text x="550" y="48" text-anchor="middle" fill="#172033" font-size="30" font-weight="bold">A boundary-value recurrence: equal first differences</text><text x="550" y="89" text-anchor="middle" fill="#172033" font-size="27" font-weight="normal">y[n + 1] − 2y[n] + y[n − 1] = 0</text><text x="550" y="130" text-anchor="middle" fill="#172033" font-size="25" font-weight="normal">Given y[0] = 1 and y[4] = 5, each step adds 1.</text><line x1="195" y1="240" x2="300" y2="240" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/><text x="250" y="215" text-anchor="middle" fill="#172033" font-size="24" font-weight="normal">+1</text><circle cx="150" cy="240" r="42" fill="#dbeafe" stroke="#2457a7" stroke-width="3"/><text x="150" y="249" text-anchor="middle" fill="#172033" font-size="30" font-weight="bold">1</text><text x="150" y="323" text-anchor="middle" fill="#172033" font-size="24" font-weight="normal">n = 0</text><line x1="395" y1="240" x2="500" y2="240" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/><text x="450" y="215" text-anchor="middle" fill="#172033" font-size="24" font-weight="normal">+1</text><circle cx="350" cy="240" r="42" fill="#f8fafc" stroke="#2457a7" stroke-width="3"/><text x="350" y="249" text-anchor="middle" fill="#172033" font-size="30" font-weight="bold">2</text><text x="350" y="323" text-anchor="middle" fill="#172033" font-size="24" font-weight="normal">n = 1</text><line x1="595" y1="240" x2="700" y2="240" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/><text x="650" y="215" text-anchor="middle" fill="#172033" font-size="24" font-weight="normal">+1</text><circle cx="550" cy="240" r="42" fill="#f8fafc" stroke="#2457a7" stroke-width="3"/><text x="550" y="249" text-anchor="middle" fill="#172033" font-size="30" font-weight="bold">3</text><text x="550" y="323" text-anchor="middle" fill="#172033" font-size="24" font-weight="normal">n = 2</text><line x1="795" y1="240" x2="900" y2="240" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/><text x="850" y="215" text-anchor="middle" fill="#172033" font-size="24" font-weight="normal">+1</text><circle cx="750" cy="240" r="42" fill="#f8fafc" stroke="#2457a7" stroke-width="3"/><text x="750" y="249" text-anchor="middle" fill="#172033" font-size="30" font-weight="bold">4</text><text x="750" y="323" text-anchor="middle" fill="#172033" font-size="24" font-weight="normal">n = 3</text><circle cx="950" cy="240" r="42" fill="#dbeafe" stroke="#2457a7" stroke-width="3"/><text x="950" y="249" text-anchor="middle" fill="#172033" font-size="30" font-weight="bold">5</text><text x="950" y="323" text-anchor="middle" fill="#172033" font-size="24" font-weight="normal">n = 4</text><rect x="130" y="375" width="840" height="105" rx="10" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/><text x="550" y="416" text-anchor="middle" fill="#172033" font-size="26" font-weight="normal">Each interior value is the mean of its neighbours.</text><text x="550" y="454" text-anchor="middle" fill="#172033" font-size="25" font-weight="normal">For n = 2:     4 − 2 × 3 + 2 = 0</text></g></svg>