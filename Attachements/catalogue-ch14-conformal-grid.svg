<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600" role="img" aria-labelledby="title description">
<title id="title">Local angle preservation under w = z²</title><desc id="description">A vertical and horizontal line meet at 1 plus i. Their images are two parabolas meeting at 2i with perpendicular tangent lines.</desc>
