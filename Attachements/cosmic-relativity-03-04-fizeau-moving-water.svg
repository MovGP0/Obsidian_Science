<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="430" viewBox="0 0 1100 430" role="img" aria-labelledby="title desc">
  <title id="title">Fizeau's moving-water interferometer</title>
  <desc id="desc">Two light beams pass in opposite directions through two horizontal parts of a flowing-water tube and return to interfere. Water flows left in the upper part and right in the lower part. A source, beam splitter, lenses, return mirror, and detector are labelled schematically.</desc>
  <defs>
    <marker id="water-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7a4e00"/>
    </marker>
    <marker id="light-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1f4e8c"/>
    </marker>
  </defs>
  <rect width="1100" height="430" rx="16" fill="#fff"/>
  <g font-family="Arial, sans-serif" fill="#172033">
    <text x="550" y="38" text-anchor="middle" font-size="25" font-weight="bold">Light with and against a flowing transparent medium</text>
    <path d="M 750 70 V 132 H 300 V 252 H 750 V 320" fill="none" stroke="#7a4e00" stroke-width="32"/>
    <path d="M 750 70 V 132 H 300 V 252 H 750 V 320" fill="none" stroke="#f1e8d4" stroke-width="27"/>
    <g stroke="#7a4e00" stroke-width="3" marker-end="url(#water-arrow)">
      <line x1="590" y1="132" x2="490" y2="132"/>
      <line x1="490" y1="252" x2="590" y2="252"/>
    </g>
    <g fill="none" stroke="#1f4e8c" stroke-width="3">
      <path d="M 980 192 L 830 132 H 200 L 70 192 L 200 252 H 830 Z"/>
      <line x1="410" y1="132" x2="365" y2="132" marker-end="url(#light-arrow)"/>
      <line x1="365" y1="252" x2="410" y2="252" marker-end="url(#light-arrow)"/>
    </g>
    <g fill="#dceaf6" stroke="#526780" stroke-width="2">
      <ellipse cx="200" cy="192" rx="6" ry="88"/>
      <ellipse cx="830" cy="192" rx="6" ry="88"/>
      <rect x="65" y="178" width="7" height="28"/>
      <rect x="1020" y="179" width="35" height="26"/>
    </g>
    <line x1="964" y1="176" x2="996" y2="208" stroke="#8c949d" stroke-width="7"/>
    <line x1="980" y1="192" x2="1020" y2="192" stroke="#1f4e8c" stroke-width="3"/>
    <line x1="980" y1="310" x2="980" y2="192" stroke="#1f4e8c" stroke-width="3"/>
    <circle cx="980" cy="310" r="8" fill="#f8d64e" stroke="#b22222" stroke-width="2"/>
    <text x="975" y="345" text-anchor="middle" font-size="20">Source S</text>
    <text x="1038" y="160" text-anchor="middle" font-size="18">Detector</text>
    <text x="70" y="325" text-anchor="middle" font-size="18">Return mirror</text>
    <text x="520" y="95" text-anchor="middle" font-size="20">Water flow</text>
    <text x="550" y="400" text-anchor="middle" font-size="18" fill="#566174">Schematic paths; fringe displacement compares opposite propagation directions.</text>
  </g>
</svg>
