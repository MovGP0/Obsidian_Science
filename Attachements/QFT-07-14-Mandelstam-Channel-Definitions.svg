<svg xmlns="http://www.w3.org/2000/svg" width="900" height="265" viewBox="0 0 900 265"><rect width="900" height="265" fill="white"/><g transform="translate(0 0)"><path d="M60 35L120 105L60 175M240 35L180 105L240 175M120 105H180" stroke="#222" stroke-width="1.5" stroke-dasharray="6 5" fill="none"/><circle cx="120" cy="105" r="4"/><circle cx="180" cy="105" r="4"/><g font-family="Georgia,serif" font-size="22" text-anchor="middle" fill="#222"><text x="47" y="26">p₁</text><text x="47" y="199">p₂</text><text x="253" y="26">p₃</text><text x="253" y="199">p₄</text><text x="150" y="94" font-style="italic">s</text><text x="150" y="238">(a) s = (p₁ + p₂)²</text></g></g><g transform="translate(300 0)"><path d="M60 35L150 75L240 35M60 175L150 135L240 175M150 75V135" stroke="#222" stroke-width="1.5" stroke-dasharray="6 5" fill="none"/><circle cx="150" cy="75" r="4"/><circle cx="150" cy="135" r="4"/><g font-family="Georgia,serif" font-size="22" text-anchor="middle" fill="#222"><text x="47" y="26">p₁</text><text x="47" y="199">p₂</text><text x="253" y="26">p₃</text><text x="253" y="199">p₄</text><text x="167" y="112" font-style="italic">t</text><text x="150" y="238">(b) t = (p₁ − p₃)²</text></g></g><g transform="translate(600 0)"><path d="M60 35L150 75L240 35M60 175L150 135L240 175M150 75V135" stroke="#222" stroke-width="1.5" stroke-dasharray="6 5" fill="none"/><circle cx="150" cy="75" r="4"/><circle cx="150" cy="135" r="4"/><g font-family="Georgia,serif" font-size="22" text-anchor="middle" fill="#222"><text x="47" y="26">p₁</text><text x="47" y="199">p₂</text><text x="253" y="26">p₄</text><text x="253" y="199">p₃</text><text x="167" y="112" font-style="italic">u</text><text x="150" y="238">(c) u = (p₁ − p₄)²</text></g></g></svg>
