<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="490" viewBox="0 0 1100 490" role="img" aria-labelledby="title desc">
  <title id="title">Curvature measured by parallel transport and relative acceleration</title>
  <desc id="desc">A vector transported from A to B along two paths has different final orientations in curved space. Comparing transported velocities on nearby trajectories gives geodesic deviation.</desc>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#253544"/></marker></defs>
  <rect width="1100" height="490" fill="white"/>
  <g font-family="Arial, sans-serif" fill="#253544" font-size="24">
    <text x="35" y="40" font-size="22" font-weight="bold">(a) Parallel transport along two paths</text>
    <path d="M100 360 L195 171 H431 M100 360 H337 L431 171" fill="none" stroke="#7b8794" stroke-width="5"/>
    <path d="M100 360 L106 274 M100 360 H187 M100 360 L142 280 M431 171 L403 83 M431 171 L464 90" fill="none" stroke="#253544" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M409 80 Q440 69 461 88" fill="none" stroke="#b45a43" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="67" y="378">A</text><text x="444" y="189">B</text><text x="207" y="149">1</text><text x="372" y="291">2</text>
    <text x="74" y="273" font-style="italic">p</text><text x="151" y="396" font-style="italic">u</text><text x="146" y="293" font-style="italic">v</text>
    <text x="374" y="78" font-style="italic">p₁</text><text x="472" y="91" font-style="italic">p₂</text>
    <text x="580" y="40" font-size="22" font-weight="bold">(b) Comparison of nearby velocities</text>
    <path d="M620 360 L683 139 H961 M620 360 H862 L961 139" fill="none" stroke="#7b8794" stroke-width="5"/>
    <path d="M620 360 L650 257 M620 360 H715 M862 360 L909 254 M683 139 L709 56 M961 139 L983 61" fill="none" stroke="#253544" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M961 139 L1011 68" fill="none" stroke="#253544" stroke-width="3" stroke-dasharray="7 5" marker-end="url(#arrow)"/>
    <text x="588" y="378">A</text><text x="973" y="159">B</text><text x="649" y="217">1</text><text x="923" y="280">2</text>
    <text x="672" y="396" font-style="italic">u</text><text x="614" y="253" font-style="italic">v</text><text x="908" y="330" font-style="italic">v′</text>
    <text x="95" y="449" font-size="19">Different final vectors measure local curvature.</text>
    <text x="602" y="449" font-size="19">Relative acceleration gives geodesic deviation.</text>
  </g>
</svg>
