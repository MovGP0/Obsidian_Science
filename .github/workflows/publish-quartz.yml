# Publishes the vault as a Quartz website on GitHub Pages.
#
# Run it manually: Actions > "Publish Quartz site" > Run workflow.
# One-time setup: Settings > Pages > Build and deployment > Source: "GitHub Actions".
#
# Quartz is checked out at a pinned version, and the overlay in `.quartz/` is applied on top of it:
# - quartz.config.ts      site configuration
# - plugins/              Obsidian compatibility (render plugins, preamble.sty, Shiki grammars)
# - styles/custom.scss    Obsidian theme variables used by the plugins

name: Publish Quartz site

on:
  workflow_dispatch:
    inputs:
      quartz-version:
        description: Quartz release tag
        required: true
        default: v4.5.2

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out vault
        uses: actions/checkout@v4
        with:
          path: vault
          fetch-depth: 0 # full history for the git-based created/modified dates
          lfs: true

      - name: Check out Quartz
        uses: actions/checkout@v4
        with:
          repository: jackyzha0/quartz
          ref: ${{ inputs.quartz-version }}
          path: quartz

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: quartz/package-lock.json

      - name: Install Quartz dependencies
        working-directory: quartz
        run: npm ci

      - name: Apply vault overlay
        run: |
          cp vault/.quartz/quartz.config.ts quartz/quartz.config.ts
          mkdir -p quartz/quartz/plugins/vault
          cp vault/.quartz/plugins/* quartz/quartz/plugins/vault/
          cp vault/.quartz/styles/custom.scss quartz/quartz/styles/custom.scss
          node vault/.quartz/create-home-page.mjs vault "Obsidian Science"

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build Quartz
        working-directory: quartz
        env:
          OBSIDIAN_VAULT: ${{ github.workspace }}/vault
          PAGES_URL: ${{ steps.pages.outputs.base_url }}
        run: |
          export QUARTZ_BASE_URL="${PAGES_URL#*://}"
          npx quartz build --directory "$OBSIDIAN_VAULT" --output public

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: quartz/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
